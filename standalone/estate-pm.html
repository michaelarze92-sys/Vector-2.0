<dialog class="modal" id="costDialog"></dialog>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================== ICONS ============================== */
  const ICON = {
    dashboard: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
    gantt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="14" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="11" y2="18"/></svg>',
    budget: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 15a2.5 2.5 0 0 0 2.5 1.5c1.5 0 2.5-.8 2.5-2s-1-1.7-2.5-2-2.5-.8-2.5-2 1-2 2.5-2a2.5 2.5 0 0 1 2.5 1.5"/><line x1="12" y1="6.5" x2="12" y2="17.5"/></svg>',
    calendar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>',
    data: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
    chevron: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
    circle: '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>',
    play: '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>',
    stop: '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>',
    check: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    shield: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg>',
    disruption: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="8" y1="8" x2="16" y2="16"/><line x1="16" y1="8" x2="8" y2="16"/></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>',
    download: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M4 19h16"/></svg>',
    menu: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>',
    upload: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><polyline points="7 14 12 9 17 14"/><path d="M4 5h16"/></svg>',
    trash: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  };
  const STATUS_ICON = { "Not Started": ICON.circle, "In Progress": ICON.play, "Blocked": ICON.stop, "Done": ICON.check };
  const STATUS_CLASS = { "Not Started": "notstarted", "In Progress": "inprogress", "Blocked": "blocked", "Done": "done" };
  const STATUSES = ["Not Started", "In Progress", "Blocked", "Done"];
  const PRIORITIES = ["Low", "Medium", "High", "Critical"];
  const CATEGORIES = ["Compliance", "Refurbishment", "Contractor-Managed", "Licensing", "Other"];

  /* ============================== DATE UTILS ============================== */
  const DAY_MS = 86400000;
  function pad2(n) { return String(n).padStart(2, "0"); }
  function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseISO(s) { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / DAY_MS); }
  function todayISO() { return toISO(new Date()); }
  function fmtShort(iso) { if (!iso) return "—"; const d = parseISO(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  function fmtLong(iso) { if (!iso) return "—"; const d = parseISO(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
  function money(n) { n = Number(n) || 0; return "£" + n.toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ============================== STATE ============================== */
  const STORE_KEY = "metroEstatesPM.v1";
  const SEED_VENUES = [
    { id: "v1", code: "v1", name: "The Empire (Leicester Sq)", region: "London" },
    { id: "v2", code: "v2", name: "Metropolitan Mayfair", region: "London" },
    { id: "v3", code: "v3", name: "Park Lane Club", region: "London" },
    { id: "v4", code: "v4", name: "The Sportsman (Marble Arch)", region: "London" },
    { id: "v5", code: "v5", name: "Alea Glasgow", region: "Northern" },
    { id: "v6", code: "v6", name: "Manchester 235", region: "Northern" },
    { id: "v7", code: "v7", name: "Alea Nottingham", region: "Northern" },
  ];

  function freshState() {
    return { venues: SEED_VENUES.map(v => ({ ...v })), projects: [], tasks: [], budgetLines: [],
      ui: { collapsed: {}, ganttZoom: "week", calMonth: todayISO().slice(0, 7) } };
  }

  let state = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return freshState();
      const parsed = JSON.parse(raw);
      const fresh = freshState();
      return Object.assign(fresh, parsed, { ui: Object.assign(fresh.ui, parsed.ui || {}) });
    } catch (e) { console.error("Failed to load saved data, starting fresh.", e); return freshState(); }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  function venueById(id) { return state.venues.find(v => v.id === id); }
  function projectById(id) { return state.projects.find(p => p.id === id); }
  function taskById(id) { return state.tasks.find(t => t.id === id); }
  function projectVenueId(p) { return p ? p.venueId : null; }
  function projectSpend(projectId) {
    return state.budgetLines.filter(b => b.projectId === projectId).reduce((s, b) => s + (Number(b.amount) || 0), 0);
  }
  function isOverdue(t) { return t.dueDate && t.dueDate < todayISO() && t.status !== "Done"; }
  function isDueThisWeek(t) { if (!t.dueDate || t.status === "Done") return false; const diff = daysBetween(todayISO(), t.dueDate); return diff >= 0 && diff <= 7; }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  /* ============================== NAV ============================== */
  const PAGES = [
    { id: "dashboard", label: "Dashboard", icon: ICON.dashboard },
    { id: "gantt", label: "Gantt", icon: ICON.gantt },
    { id: "budget", label: "Budget", icon: ICON.budget },
    { id: "calendar", label: "Calendar", icon: ICON.calendar },
    { id: "data", label: "Data & Backup", icon: ICON.data },
  ];
  let activePage = "dashboard";

  function renderNav() {
    const list = document.getElementById("navList");
    list.innerHTML = PAGES.map(p => `
      <li><button class="nav-item ${p.id === activePage ? "active" : ""}" data-nav="${p.id}">${p.icon}<span>${p.label}</span></button></li>
    `).join("");
    document.getElementById("navFoot").textContent = "Saved to this browser only — export a backup from Data & Backup to move it.";
  }

  function go(pageId) { activePage = pageId; renderNav(); renderPage(); closeNav(); }

  document.getElementById("navList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-nav]"); if (!btn) return; go(btn.dataset.nav);
  });

  function openNav() { document.getElementById("nav").classList.add("open"); document.getElementById("navBackdrop").classList.add("show"); }
  function closeNav() { document.getElementById("nav").classList.remove("open"); document.getElementById("navBackdrop").classList.remove("show"); }
  document.getElementById("hamburgerBtn").innerHTML = ICON.menu;
  document.getElementById("hamburgerBtn").addEventListener("click", openNav);
  document.getElementById("navBackdrop").addEventListener("click", closeNav);

  /* ============================== QUICK ADD ============================== */
  function refreshQuickAddProjects() {
    const sel = document.getElementById("qaProject");
    const cur = sel.value;
    let html = '<option value="">No project (standalone)</option>';
    state.venues.forEach(v => {
      const projs = state.projects.filter(p => p.venueId === v.id);
      if (!projs.length) return;
      html += `<optgroup label="${escapeHtml(v.name)}">` + projs.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("") + `</optgroup>`;
    });
    sel.innerHTML = html;
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  }

  document.getElementById("quickAddForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("qaName").value.trim();
    if (!name) return;
    const projectId = document.getElementById("qaProject").value || null;
    const due = document.getElementById("qaDue").value || null;
    const proj = projectId ? projectById(projectId) : null;
    const task = {
      id: uid(), projectId: projectId, venueId: proj ? proj.venueId : null,
      name, ownerName: "", ownerEmail: "", startDate: todayISO(), dueDate: due,
      status: "Not Started", priority: "Medium", dependsOnTaskId: null, boardInputRequired: false,
      notes: "", checklist: [], progressPct: 0, createdAt: Date.now(),
    };
    state.tasks.push(task); save();
    document.getElementById("qaName").value = ""; document.getElementById("qaDue").value = "";
    toast("Task added"); renderPage();
  });

  function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  /* ============================== DASHBOARD ============================== */
  function renderDashboard() {
    const tasks = state.tasks;
    const overdue = tasks.filter(isOverdue).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    const dueWeek = tasks.filter(t => isDueThisWeek(t) && !isOverdue(t)).sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
    const openTasks = tasks.filter(t => t.status !== "Done").length;
    const inProgressProjects = state.projects.filter(p => p.status === "In Progress").length;
    const budgetAlerts = state.projects.map(p => ({ p, spend: projectSpend(p.id) }))
      .filter(x => x.p.budgetAllocated > 0 && x.spend / x.p.budgetAllocated >= 0.85)
      .sort((a, b) => (b.spend / b.p.budgetAllocated) - (a.spend / a.p.budgetAllocated));

    return `
      <div class="page-head">
        <div><h1>What needs you today</h1><div class="desc">${fmtLong(todayISO())} — overdue and this week's deadlines, at a glance.</div></div>
      </div>
      <div class="stat-row">
        <div class="stat-tile"><div class="label">Overdue</div><div class="value ${overdue.length ? "accent-bad" : ""}">${overdue.length}</div><div class="sub">tasks past due date</div></div>
        <div class="stat-tile"><div class="label">Due this week</div><div class="value ${dueWeek.length ? "accent-warn" : ""}">${dueWeek.length}</div><div class="sub">next 7 days</div></div>
        <div class="stat-tile"><div class="label">Open tasks</div><div class="value">${openTasks}</div><div class="sub">across ${state.projects.length} project${state.projects.length === 1 ? "" : "s"}</div></div>
        <div class="stat-tile"><div class="label">Budget alerts</div><div class="value ${budgetAlerts.length ? "accent-bad" : "accent-good"}">${budgetAlerts.length}</div><div class="sub">projects ≥85% of budget</div></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Overdue</h2>${overdue.length ? `<span class="g-count">${overdue.length}</span>` : ""}</div>
        <div class="card-body">${overdue.length ? overdue.map(t => taskRowHtml(t, true)).join("") : emptyState("Nothing overdue — you're on top of it.")}</div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Due this week</h2>${dueWeek.length ? `<span class="g-count">${dueWeek.length}</span>` : ""}</div>
        <div class="card-body">${dueWeek.length ? dueWeek.map(t => taskRowHtml(t, false)).join("") : emptyState("Nothing due in the next 7 days.")}</div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Budget alerts</h2></div>
        <div class="card-body pad">${budgetAlerts.length ? budgetAlerts.map(x => budgetAlertRow(x)).join("") : emptyState("No projects are close to their budget limit.")}</div>
      </div>
    `;
  }

  function budgetAlertRow(x) {
    const pct = Math.round((x.spend / x.p.budgetAllocated) * 100);
    const over = pct >= 100;
    return `<div class="task-row" data-open-project="${x.p.id}" style="cursor:pointer">
      <span class="chip ${over ? "chip-blocked" : "chip-inprogress"}">${pct}%</span>
      <div class="t-main"><div class="t-name">${escapeHtml(x.p.name)}</div><div class="t-meta">${money(x.spend)} of ${money(x.p.budgetAllocated)} spent</div></div>
    </div>`;
  }

  function emptyState(msg, cta) {
    return `<div class="empty-state">${escapeHtml(msg)}${cta ? `<div>${cta}</div>` : ""}</div>`;
  }

  function taskRowHtml(t, overdueStyle) {
    const proj = projectById(t.projectId);
    const venue = venueById(t.venueId || (proj && proj.venueId));
    const meta = [proj ? proj.name : null, venue ? venue.name : null].filter(Boolean).join(" · ");
    return `<div class="task-row ${overdueStyle ? "overdue-row" : ""}" data-open-task="${t.id}">
      <span class="chip chip-${STATUS_CLASS[t.status]}">${STATUS_ICON[t.status]}</span>
      <div class="t-main"><div class="t-name">${escapeHtml(t.name)}</div><div class="t-meta">${escapeHtml(meta || "Unassigned")}${t.ownerName ? " · " + escapeHtml(t.ownerName) : ""}</div></div>
      <div class="t-due" style="color:${overdueStyle ? "var(--st-blocked)" : "var(--ink-secondary)"}">${fmtShort(t.dueDate)}</div>
    </div>`;
  }

  /* ============================== GANTT ============================== */
  const ZOOM_CFG = {
    day: { pxPerDay: 46, unit: "day" },
    week: { pxPerDay: 17, unit: "week" },
    month: { pxPerDay: 5.5, unit: "month" },
    quarter: { pxPerDay: 2, unit: "quarter" },
  };

  function ganttRange() {
    let min = null, max = null;
    state.projects.forEach(p => { if (p.startDate) min = min ? (p.startDate < min ? p.startDate : min) : p.startDate; if (p.targetEndDate) max = max ? (p.targetEndDate > max ? p.targetEndDate : max) : p.targetEndDate; });
    state.tasks.forEach(t => { if (t.startDate) min = min ? (t.startDate < min ? t.startDate : min) : t.startDate; if (t.dueDate) max = max ? (t.dueDate > max ? t.dueDate : max) : t.dueDate; });
    const today = todayISO();
    if (!min) min = addDays(today, -14);
    if (!max) max = addDays(today, 60);
    if (today < min) min = today; if (today > max) max = today;
    min = addDays(min, -7); max = addDays(max, 21);
    return { start: min, end: max };
  }

  function genTicks(zoom, range) {
    const ticks = []; const cfg = ZOOM_CFG[zoom];
    if (zoom === "day") {
      let cur = range.start;
      while (cur <= range.end) {
        const d = parseISO(cur);
        ticks.push({ x: daysBetween(range.start, cur) * cfg.pxPerDay, w: cfg.pxPerDay, label: d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" }) });
        cur = addDays(cur, 1);
      }
    } else if (zoom === "week") {
      let d = parseISO(range.start); const day = d.getDay(); const back = (day + 6) % 7; d.setDate(d.getDate() - back);
      let cur = toISO(d);
      while (cur <= range.end) {
        ticks.push({ x: daysBetween(range.start, cur) * cfg.pxPerDay, w: 7 * cfg.pxPerDay, label: fmtShort(cur) + " – " + fmtShort(addDays(cur, 6)) });
        cur = addDays(cur, 7);
      }
    } else if (zoom === "month") {
      let d = parseISO(range.start); d.setDate(1); let cur = toISO(d);
      while (cur <= range.end) {
        const dt = parseISO(cur); const nextMonth = new Date(dt.getFullYear(), dt.getMonth() + 1, 1);
        const wDays = Math.round((nextMonth - dt) / DAY_MS);
        ticks.push({ x: Math.max(0, daysBetween(range.start, cur)) * cfg.pxPerDay, w: wDays * cfg.pxPerDay, label: dt.toLocaleDateString(undefined, { month: "long", year: "numeric" }) });
        cur = toISO(nextMonth);
      }
    } else {
      let d = parseISO(range.start); const qStartMonth = Math.floor(d.getMonth() / 3) * 3; d = new Date(d.getFullYear(), qStartMonth, 1); let cur = toISO(d);
      while (cur <= range.end) {
        const dt = parseISO(cur); const nextQ = new Date(dt.getFullYear(), dt.getMonth() + 3, 1);
        const wDays = Math.round((nextQ - dt) / DAY_MS);
        ticks.push({ x: Math.max(0, daysBetween(range.start, cur)) * cfg.pxPerDay, w: wDays * cfg.pxPerDay, label: "Q" + (Math.floor(dt.getMonth() / 3) + 1) + " " + dt.getFullYear() });
        cur = toISO(nextQ);
      }
    }
    return ticks;
  }

  function groupKey(kind, id) { return kind + ":" + id; }
  function isCollapsed(key) { return !!state.ui.collapsed[key]; }

  function renderGantt() {
    const zoom = state.ui.ganttZoom; const cfg = ZOOM_CFG[zoom]; const range = ganttRange();
    const totalDays = daysBetween(range.start, range.end); const totalWidth = totalDays * cfg.pxPerDay;
    const ticks = genTicks(zoom, range);

    let rowsHtml = ""; let barsHtml = ""; let y = 0; const rowH = 44;
    const barPositions = {}; // taskId -> {x1,x2,y}

    function addRowLabel(html) { rowsHtml += html; }
    function addBarLayer(html) { barsHtml += html; }

    const hasAnything = state.venues.some(v => state.projects.some(p => p.venueId === v.id) || state.tasks.some(t => (t.venueId === v.id) && !t.projectId));
    const unassignedTasks = state.tasks.filter(t => !t.projectId && !t.venueId);

    state.venues.forEach(v => {
      const venueProjects = state.projects.filter(p => p.venueId === v.id);
      const venueLooseTasks = state.tasks.filter(t => !t.projectId && t.venueId === v.id);
      if (!venueProjects.length && !venueLooseTasks.length) return;
      const vKey = groupKey("venue", v.id); const vCollapsed = isCollapsed(vKey);
      addRowLabel(`<div class="g-rowlabel group-venue">
        <button class="g-collapse ${vCollapsed ? "collapsed" : ""}" data-toggle-group="${vKey}">${ICON.chevron}</button>
        <span class="g-label-name">${escapeHtml(v.name)}</span>
        <span class="g-count">${venueProjects.length + venueLooseTasks.length}</span>
      </div>`);
      addBarLayer(`<div class="g-row group-venue" style="width:${totalWidth}px"></div>`);
      y += rowH;
      if (!vCollapsed) {
        venueProjects.forEach(p => {
          const pKey = groupKey("project", p.id); const pCollapsed = isCollapsed(pKey);
          const projTasks = state.tasks.filter(t => t.projectId === p.id);
          addRowLabel(`<div class="g-rowlabel group-project">
            <button class="g-collapse ${pCollapsed ? "collapsed" : ""}" data-toggle-group="${pKey}" style="margin-left:14px">${ICON.chevron}</button>
            <span class="g-label-name">${escapeHtml(p.name)}</span>
            ${p.licenceRiskFlag ? `<span class="g-icon-flag" style="color:var(--st-blocked)" title="Licence risk">${ICON.shield}</span>` : ""}
            ${p.gamingFloorDisruption ? `<span class="g-icon-flag" style="color:var(--pr-high)" title="Gaming floor disruption">${ICON.disruption}</span>` : ""}
            <span class="g-count">${projTasks.length}</span>
          </div>`);
          addBarLayer(`<div class="g-row group-project" style="width:${totalWidth}px"></div>`);
          y += rowH;
          if (!pCollapsed) {
            projTasks.forEach(t => { const r = renderTaskRow(t, range, cfg, totalWidth, y, barPositions); addRowLabel(r.label); addBarLayer(r.bar); y += rowH; });
          }
        });
        venueLooseTasks.forEach(t => { const r = renderTaskRow(t, range, cfg, totalWidth, y, barPositions); addRowLabel(r.label); addBarLayer(r.bar); y += rowH; });
      }
    });

    if (unassignedTasks.length) {
      const uKey = groupKey("venue", "unassigned"); const uCollapsed = isCollapsed(uKey);
      addRowLabel(`<div class="g-rowlabel group-venue">
        <button class="g-collapse ${uCollapsed ? "collapsed" : ""}" data-toggle-group="${uKey}">${ICON.chevron}</button>
        <span class="g-label-name">Unassigned</span><span class="g-count">${unassignedTasks.length}</span>
      </div>`);
      addBarLayer(`<div class="g-row group-venue" style="width:${totalWidth}px"></div>`);
      y += rowH;
      if (!uCollapsed) unassignedTasks.forEach(t => { const r = renderTaskRow(t, range, cfg, totalWidth, y, barPositions); addRowLabel(r.label); addBarLayer(r.bar); y += rowH; });
    }

    const totalHeight = y;
    const todayX = daysBetween(range.start, todayISO()) * cfg.pxPerDay;

    let depSvg = "";
    state.tasks.forEach(t => {
      if (!t.dependsOnTaskId) return;
      const from = barPositions[t.dependsOnTaskId]; const to = barPositions[t.id];
      if (!from || !to) return;
      const midX = from.x2 + 14;
      depSvg += `<path class="g-dep-line" d="M ${from.x2} ${from.y} H ${midX} V ${to.y} H ${to.x1 - 6}"/>
        <polygon class="g-dep-arrow" points="${to.x1 - 6},${to.y - 4} ${to.x1},${to.y} ${to.x1 - 6},${to.y + 4}"/>`;
    });

    const gridlines = ticks.map(t => `<div class="gantt-gridline" style="left:${t.x}px;height:${totalHeight}px"></div>`).join("");

    const body = !hasAnything && !unassignedTasks.length ? emptyState("No projects or tasks yet. Use “+ New project” or the quick-add bar above to get started.") : `
      <div class="gantt-scroll">
        <div class="gantt-inner" style="width:${268 + totalWidth}px">
          <div class="gantt-header-row">
            <div class="gantt-header-spacer"></div>
            ${ticks.map(t => `<div class="gantt-tick" style="width:${t.w}px">${t.label}</div>`).join("")}
          </div>
          <div class="gantt-body">
            <div class="gantt-rowlabels">${rowsHtml}</div>
            <div class="gantt-timeline" style="width:${totalWidth}px;height:${totalHeight}px">
              ${gridlines}
              ${barsHtml}
              <svg style="position:absolute;top:0;left:0;width:${totalWidth}px;height:${totalHeight}px;pointer-events:none">${depSvg}</svg>
              <div class="gantt-today" style="left:${todayX}px;height:${totalHeight}px"><span class="flag">Today</span></div>
            </div>
          </div>
        </div>
      </div>
    `;

    return `
      <div class="page-head">
        <div><h1>Estate Gantt</h1><div class="desc">Drag a bar to reschedule, drag its edges to resize. Grouped by venue → project.</div></div>
        <div class="page-actions">
          <button class="btn" data-action="new-project">${ICON.plus} New project</button>
        </div>
      </div>
      <div class="card">
        <div class="gantt-toolbar">
          <div class="zoom-toggle">${["day", "week", "month", "quarter"].map(z => `<button class="${z === zoom ? "active" : ""}" data-zoom="${z}">${z[0].toUpperCase() + z.slice(1)}</button>`).join("")}</div>
          <div class="gantt-legend">
            ${STATUSES.map(s => `<span class="item"><span class="sw" style="background:var(--st-${STATUS_CLASS[s]})"></span>${s}</span>`).join("")}
          </div>
        </div>
        ${body}
      </div>
    `;
  }

  function renderTaskRow(t, range, cfg, totalWidth, y, barPositions) {
    const start = t.startDate || t.dueDate || todayISO();
    const due = t.dueDate || t.startDate || todayISO();
    const dur = Math.max(daysBetween(start, due), 0);
    const x1 = Math.max(0, daysBetween(range.start, start)) * cfg.pxPerDay;
    const cls = STATUS_CLASS[t.status];
    const label = `<div class="g-rowlabel"><span class="g-label-name task-label">${escapeHtml(t.name)}</span></div>`;
    let bar;
    if (dur === 0) {
      bar = `<div class="g-milestone st-${cls}" style="left:${x1}px;top:${y + 10}px" data-task-id="${t.id}" data-drag="move" title="${escapeHtml(t.name)}"></div>`;
      barPositions[t.id] = { x1, x2: x1, y: y + rowMid() };
    } else {
      const w = Math.max(dur * cfg.pxPerDay, 14);
      bar = `<div class="g-bar-track" style="left:${x1}px;width:${w}px;top:${y + 7}px;height:30px">
        <div class="g-bar st-${cls}" data-task-id="${t.id}" data-drag="move" title="${escapeHtml(t.name)} — ${fmtShort(start)} to ${fmtShort(due)}">
          <div class="g-bar-fill" style="width:${Math.max(0, Math.min(100, t.progressPct || 0))}%"></div>
          <span class="g-bar-label">${escapeHtml(t.name)}</span>
          <div class="g-bar-handle left" data-task-id="${t.id}" data-drag="start"></div>
          <div class="g-bar-handle right" data-task-id="${t.id}" data-drag="end"></div>
        </div>
      </div>`;
      barPositions[t.id] = { x1, x2: x1 + w, y: y + rowMid() };
    }
    return { label, bar };
    function rowMid() { return 22; }
  }

  /* ---- Gantt interactions: zoom, collapse, drag ---- */
  function bindGanttEvents(root) {
    root.querySelectorAll("[data-zoom]").forEach(btn => btn.addEventListener("click", () => { state.ui.ganttZoom = btn.dataset.zoom; save(); renderPage(); }));
    root.querySelectorAll("[data-toggle-group]").forEach(btn => btn.addEventListener("click", () => {
      const k = btn.dataset.toggleGroup; state.ui.collapsed[k] = !state.ui.collapsed[k]; save(); renderPage();
    }));
    const timeline = root.querySelector(".gantt-timeline");
    if (!timeline) return;
    const cfg = ZOOM_CFG[state.ui.ganttZoom];
    root.querySelectorAll("[data-drag]").forEach(el => {
      el.addEventListener("pointerdown", (e) => startDrag(e, el, cfg));
    });
    root.querySelectorAll(".g-bar-label, .g-bar, .g-milestone").forEach(el => {
      el.addEventListener("click", (e) => { if (el._dragged) { el._dragged = false; return; } const id = el.dataset.taskId || el.closest("[data-task-id]").dataset.taskId; openTaskModal(id); });
    });
    // scroll to today on first paint
    const scrollWrap = root.querySelector(".gantt-scroll");
    if (scrollWrap && !scrollWrap._scrolled) {
      const flag = root.querySelector(".gantt-today");
      if (flag) { const left = parseFloat(flag.style.left) - 220; scrollWrap.scrollLeft = Math.max(0, left); }
      scrollWrap._scrolled = true;
    }
  }

  function startDrag(e, el, cfg) {
    e.preventDefault(); e.stopPropagation();
    const taskId = el.dataset.taskId; const t = taskById(taskId); if (!t) return;
    const mode = el.dataset.drag; const startX = e.clientX;
    const origStart = t.startDate || t.dueDate || todayISO(); const origDue = t.dueDate || t.startDate || todayISO();
    let lastDelta = 0; el._dragged = false;
    const barEl = mode === "move" ? el : el.closest(".g-bar") || el;
    function onMove(ev) {
      const deltaPx = ev.clientX - startX; const deltaDays = Math.round(deltaPx / cfg.pxPerDay);
      if (deltaDays === lastDelta) return; lastDelta = deltaDays; el._dragged = true;
      barEl.style.transition = "none";
      if (mode === "move") { barEl.parentElement.style.transform = `translateX(${deltaDays * cfg.pxPerDay}px)`; }
      else if (mode === "start") { const w = parseFloat(barEl.parentElement.style.width); barEl.parentElement.style.transform = `translateX(${deltaDays * cfg.pxPerDay}px)`; barEl.parentElement.style.width = Math.max(14, w - deltaDays * cfg.pxPerDay) + "px"; }
      else { const w = parseFloat(barEl.parentElement.style.width); barEl.parentElement.style.width = Math.max(14, w + deltaDays * cfg.pxPerDay) + "px"; }
    }
    function onUp() {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
      if (lastDelta !== 0) {
        if (mode === "move") { t.startDate = addDays(origStart, lastDelta); t.dueDate = addDays(origDue, lastDelta); }
        else if (mode === "start") { let ns = addDays(origStart, lastDelta); if (ns > (t.dueDate || origDue)) ns = t.dueDate || origDue; t.startDate = ns; }
        else { let nd = addDays(origDue, lastDelta); if (nd < (t.startDate || origStart)) nd = t.startDate || origStart; t.dueDate = nd; }
        save(); renderPage();
      } else if (barEl.parentElement) { barEl.parentElement.style.transform = ""; }
    }
    window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp, { once: true });
  }

  /* ============================== BUDGET ============================== */
  function renderBudget() {
    const totalAllocated = state.projects.reduce((s, p) => s + (Number(p.budgetAllocated) || 0), 0);
    const totalSpent = state.projects.reduce((s, p) => s + projectSpend(p.id), 0);
    return `
      <div class="page-head">
        <div><h1>Budget</h1><div class="desc">Allocated vs. spent per project, with burn-rate against the schedule.</div></div>
        <div class="page-actions"><button class="btn" data-action="log-cost">${ICON.plus} Log a cost</button></div>
      </div>
      <div class="stat-row">
        <div class="stat-tile"><div class="label">Total allocated</div><div class="value">${money(totalAllocated)}</div></div>
        <div class="stat-tile"><div class="label">Total spent</div><div class="value">${money(totalSpent)}</div></div>
        <div class="stat-tile"><div class="label">Variance</div><div class="value ${totalSpent > totalAllocated ? "accent-bad" : "accent-good"}">${money(totalAllocated - totalSpent)}</div><div class="sub">${totalSpent > totalAllocated ? "over" : "remaining"}</div></div>
        <div class="stat-tile"><div class="label">Projects tracked</div><div class="value">${state.projects.length}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Projects</h2></div>
        <div class="card-body budget-card">
          ${state.projects.length ? state.projects.map(budgetRow).join("") : emptyState("No projects yet — add one from the Gantt page to start tracking budget.")}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Cost log</h2></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Date</th><th>Description</th><th>Supplier</th><th>Project</th><th>Category</th><th class="num">Amount</th></tr></thead>
          <tbody>${state.budgetLines.length ? [...state.budgetLines].sort((a, b) => b.dateLogged.localeCompare(a.dateLogged)).map(costRow).join("") : `<tr><td colspan="6">${emptyState("No costs logged yet.")}</td></tr>`}</tbody>
        </table></div>
      </div>
    `;
  }

  function budgetRow(p) {
    const spend = projectSpend(p.id); const alloc = Number(p.budgetAllocated) || 0;
    const pct = alloc > 0 ? (spend / alloc) * 100 : 0;
    const venue = venueById(p.venueId);
    let elapsedPct = null;
    if (p.startDate && p.targetEndDate) {
      const total = Math.max(daysBetween(p.startDate, p.targetEndDate), 1);
      const elapsed = Math.min(Math.max(daysBetween(p.startDate, todayISO()), 0), total);
      elapsedPct = (elapsed / total) * 100;
    }
    let burnLabel = "No schedule set", burnClass = "";
    if (elapsedPct !== null && alloc > 0) {
      if (pct <= elapsedPct + 5) { burnLabel = "On track"; burnClass = "burn-ontrack"; }
      else if (pct <= elapsedPct + 20) { burnLabel = "Trending over"; burnClass = "burn-watch"; }
      else { burnLabel = "Overspend risk"; burnClass = "burn-over"; }
    }
    return `<div class="budget-project-row" data-open-project="${p.id}" style="cursor:pointer">
      <div class="bp-head">
        <div><div class="bp-name">${escapeHtml(p.name)}</div><div class="bp-venue">${venue ? escapeHtml(venue.name) : "No venue"} · ${escapeHtml(p.category || "Other")}</div></div>
        <div class="bp-figures">${money(spend)} / ${money(alloc)}</div>
      </div>
      <div class="bp-bar-track">
        <div class="bp-bar-fill ${pct >= 100 ? "over" : pct >= 85 ? "warn" : ""}" style="width:${Math.min(pct, 100)}%"></div>
        ${elapsedPct !== null ? `<div class="bp-marker" style="left:${Math.min(elapsedPct, 100)}%" title="Schedule elapsed"></div>` : ""}
      </div>
      <div class="bp-foot"><span class="burn-chip ${burnClass}">${burnLabel}</span><span style="font-size:11.5px;color:var(--ink-muted)">${Math.round(pct)}% of budget used</span></div>
    </div>`;
  }

  function costRow(b) {
    const p = projectById(b.projectId);
    return `<tr><td>${fmtShort(b.dateLogged)}</td><td>${escapeHtml(b.description)}</td><td>${escapeHtml(b.supplier || "—")}</td><td>${p ? escapeHtml(p.name) : "—"}</td><td>${escapeHtml(b.category || "—")}</td><td class="num">${money(b.amount)}</td></tr>`;
  }

  /* ============================== CALENDAR ============================== */
  function renderCalendar() {
    const [y, m] = state.ui.calMonth.split("-").map(Number);
    const first = new Date(y, m - 1, 1); const startDow = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m, 0).getDate();
    const gridStart = new Date(y, m - 1, 1 - startDow);
    const cells = [];
    for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }
    const monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const tasksByDay = {};
    state.tasks.forEach(t => { if (t.dueDate) (tasksByDay[t.dueDate] = tasksByDay[t.dueDate] || []).push(t); });

    const dow = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const cellsHtml = cells.map(d => {
      const iso = toISO(d); const out = d.getMonth() !== m - 1; const isToday = iso === todayISO();
      const dayTasks = tasksByDay[iso] || [];
      return `<div class="cal-cell ${out ? "out" : ""} ${isToday ? "today" : ""}">
        <div class="cal-daynum">${d.getDate()}</div>
        ${dayTasks.slice(0, 3).map(t => `<div class="cal-chip chip-${STATUS_CLASS[t.status]}" style="background:var(--st-${STATUS_CLASS[t.status]}-soft);color:var(--st-${STATUS_CLASS[t.status]})" data-open-task="${t.id}">${escapeHtml(t.name)}</div>`).join("")}
        ${dayTasks.length > 3 ? `<div class="cal-chip" style="color:var(--ink-muted)">+${dayTasks.length - 3} more</div>` : ""}
      </div>`;
    }).join("");

    return `
      <div class="page-head">
        <div><h1>Calendar</h1><div class="desc">Tasks by due date.</div></div>
        <div class="page-actions">
          <button class="btn btn-sm" data-cal-nav="-1">‹ Prev</button>
          <strong style="min-width:140px;text-align:center;display:inline-block">${monthLabel}</strong>
          <button class="btn btn-sm" data-cal-nav="1">Next ›</button>
        </div>
      </div>
      <div class="card"><div class="card-body pad">
        <div class="cal-grid">
          ${dow.map(d => `<div class="cal-dow">${d}</div>`).join("")}
          ${cellsHtml}
        </div>
      </div></div>
    `;
  }

  /* ============================== DATA & BACKUP ============================== */
  function renderData() {
    const bytes = new Blob([JSON.stringify(state)]).size;
    return `
      <div class="page-head"><div><h1>Data &amp; Backup</h1><div class="desc">Everything here lives in this browser only. Export a backup to move it or keep a snapshot.</div></div></div>
      <div class="banner banner-info" style="margin-bottom:16px">Stored locally (${(bytes / 1024).toFixed(1)} KB) — clearing your browser data will erase it unless you've exported a backup.</div>
      <div class="card">
        <div class="card-head"><h2>Backup</h2></div>
        <div class="card-body pad" style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-accent" data-action="export">${ICON.download} Export backup (.json)</button>
          <label class="btn" style="cursor:pointer">${ICON.upload} Import backup<input type="file" accept="application/json" id="importFile" style="display:none"></label>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Venues</h2></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Code</th><th>Venue</th><th>Region</th><th class="num">Projects</th></tr></thead>
          <tbody>${state.venues.map(v => `<tr><td>${v.code}</td><td>${escapeHtml(v.name)}</td><td>${v.region}</td><td class="num">${state.projects.filter(p => p.venueId === v.id).length}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Reset</h2></div>
        <div class="card-body pad">
          <button class="btn modal-danger" data-action="reset-all">${ICON.trash} Erase all data in this browser</button>
        </div>
      </div>
    `;
  }

  async function exportBackup() {
    const payload = JSON.stringify(state, null, 2);
    const filename = "metropolitan-estates-backup-" + todayISO() + ".json";
    if (window.claude && window.claude.downloads) {
      try { await window.claude.downloads.save({ filename, data: payload }); toast("Backup saved"); }
      catch (err) { if (err && err.code === "declined") return; toast("Couldn't save the file (" + (err && err.code || "unknown") + ")"); }
    } else {
      const blob = new Blob([payload], { type: "application/json" }); const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
      toast("Backup saved");
    }
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.venues)) throw new Error("Not a recognised backup file");
        state = Object.assign(freshState(), parsed, { ui: Object.assign(freshState().ui, parsed.ui || {}) });
        save(); toast("Backup imported"); renderPage();
      } catch (e) { toast("Import failed — that file doesn't look like a backup"); }
    };
    reader.readAsText(file);
  }

  /* ============================== PAGE DISPATCH ============================== */
  function renderPage() {
    refreshQuickAddProjects();
    const content = document.getElementById("content");
    let html = "";
    if (activePage === "dashboard") html = renderDashboard();
    else if (activePage === "gantt") html = renderGantt();
    else if (activePage === "budget") html = renderBudget();
    else if (activePage === "calendar") html = renderCalendar();
    else if (activePage === "data") html = renderData();
    content.innerHTML = `<div class="page active">${html}</div>`;
    bindPageEvents(content);
  }

  function bindPageEvents(root) {
    root.querySelectorAll("[data-open-task]").forEach(el => el.addEventListener("click", (e) => { if (e.target.closest("[data-open-task]") !== el) return; openTaskModal(el.dataset.openTask); }));
    root.querySelectorAll("[data-open-project]").forEach(el => el.addEventListener("click", (e) => { if (e.target.closest("button")) return; openProjectModal(el.dataset.openProject); }));
    const newProjectBtn = root.querySelector('[data-action="new-project"]'); if (newProjectBtn) newProjectBtn.addEventListener("click", () => openProjectModal(null));
    const logCostBtn = root.querySelector('[data-action="log-cost"]'); if (logCostBtn) logCostBtn.addEventListener("click", () => openCostModal());
    const exportBtn = root.querySelector('[data-action="export"]'); if (exportBtn) exportBtn.addEventListener("click", exportBackup);
    const importInput = root.querySelector("#importFile"); if (importInput) importInput.addEventListener("change", () => { if (importInput.files[0]) importBackup(importInput.files[0]); });
    const resetBtn = root.querySelector('[data-action="reset-all"]'); if (resetBtn) resetBtn.addEventListener("click", () => {
      if (confirm("Erase all projects, tasks and budget data in this browser? This can't be undone unless you have a backup file.")) { state = freshState(); save(); toast("All data erased"); renderPage(); }
    });
    root.querySelectorAll("[data-cal-nav]").forEach(el => el.addEventListener("click", () => {
      const [y, m] = state.ui.calMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(el.dataset.calNav), 1);
      state.ui.calMonth = d.getFullYear() + "-" + pad2(d.getMonth() + 1); save(); renderPage();
    }));
    if (activePage === "gantt") bindGanttEvents(root);
  }

  /* ============================== TASK MODAL ============================== */
  function openTaskModal(id) {
    const dlg = document.getElementById("taskDialog");
    const existing = id ? taskById(id) : null;
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: null, projectId: null, venueId: null, name: "", ownerName: "", ownerEmail: "",
      startDate: todayISO(), dueDate: "", status: "Not Started", priority: "Medium",
      dependsOnTaskId: null, boardInputRequired: false, notes: "", checklist: [], progressPct: 0,
    };
    renderTaskModal(dlg, draft, !!existing);
    dlg.showModal();
  }

  function renderTaskModal(dlg, draft, isEdit) {
    const projectOptions = state.projects.map(p => `<option value="${p.id}" ${draft.projectId === p.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("");
    const otherTasks = state.tasks.filter(t => t.id !== draft.id);
    const depOptions = `<option value="">None</option>` + otherTasks.map(t => `<option value="${t.id}" ${draft.dependsOnTaskId === t.id ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("");

    dlg.innerHTML = `
      <div class="modal-head"><h3>${isEdit ? "Edit task" : "New task"}</h3><button class="icon-x" data-close>${ICON.x}</button></div>
      <div class="modal-body">
        <div class="field"><label>Task name</label><input type="text" id="mName" value="${escapeHtml(draft.name)}" required /></div>
        <div class="field-row">
          <div class="field"><label>Project</label><select id="mProject"><option value="">No project</option>${projectOptions}</select></div>
          <div class="field"><label>Depends on</label><select id="mDep">${depOptions}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Start date</label><input type="date" id="mStart" value="${draft.startDate || ""}" /></div>
          <div class="field"><label>Due date</label><input type="date" id="mDue" value="${draft.dueDate || ""}" /></div>
        </div>
        <div class="field"><label>Status</label><div class="status-pick" id="mStatus">${STATUSES.map(s => `<button type="button" data-v="${s}" class="${draft.status === s ? "active" : ""}">${s}</button>`).join("")}</div></div>
        <div class="field"><label>Priority</label><div class="priority-pick" id="mPriority">${PRIORITIES.map(s => `<button type="button" data-v="${s}" class="${draft.priority === s ? "active" : ""}">${s}</button>`).join("")}</div></div>
        <div class="field-row">
          <div class="field"><label>Delegate to (name)</label><input type="text" id="mOwnerName" value="${escapeHtml(draft.ownerName)}" /></div>
          <div class="field"><label>Delegate email</label><input type="text" id="mOwnerEmail" value="${escapeHtml(draft.ownerEmail)}" /></div>
        </div>
        <div class="toggle-row"><span>Requires Board input<div class="hint">Flags this task in reporting</div></span><label class="switch"><input type="checkbox" id="mBoard" ${draft.boardInputRequired ? "checked" : ""} /><span class="track"></span></label></div>
        <div class="field"><label>Checklist</label><div id="mChecklist"></div>
          <div class="checklist-add"><input type="text" id="mNewCheck" placeholder="Add a subtask…" /><button class="btn btn-sm" id="mAddCheck" type="button">${ICON.plus}</button></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="mNotes">${escapeHtml(draft.notes)}</textarea></div>
      </div>
      <div class="modal-foot">
        <div>${isEdit ? `<button class="btn btn-ghost modal-danger" id="mDelete">${ICON.trash} Delete</button>` : "<span></span>"}</div>
        <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn btn-accent" id="mSave">Save</button></div>
      </div>
    `;

    function renderChecklist() {
      const el = dlg.querySelector("#mChecklist");
      el.innerHTML = draft.checklist.map((c, i) => `
        <div class="checklist-item">
          <input type="checkbox" data-ci="${i}" ${c.done ? "checked" : ""} />
          <input type="text" data-cl="${i}" value="${escapeHtml(c.label)}" />
          <button type="button" class="icon-x" data-cx="${i}">${ICON.x}</button>
        </div>`).join("") || `<div style="font-size:12px;color:var(--ink-muted);padding:4px 0">No subtasks yet.</div>`;
      el.querySelectorAll("[data-ci]").forEach(c => c.addEventListener("change", () => { draft.checklist[+c.dataset.ci].done = c.checked; }));
      el.querySelectorAll("[data-cl]").forEach(c => c.addEventListener("input", () => { draft.checklist[+c.dataset.cl].label = c.value; }));
      el.querySelectorAll("[data-cx]").forEach(c => c.addEventListener("click", () => { draft.checklist.splice(+c.dataset.cx, 1); renderChecklist(); }));
    }
    renderChecklist();

    dlg.querySelector("#mAddCheck").addEventListener("click", () => {
      const inp = dlg.querySelector("#mNewCheck"); const label = inp.value.trim(); if (!label) return;
      draft.checklist.push({ id: uid(), label, done: false }); inp.value = ""; renderChecklist();
    });
    dlg.querySelector("#mStatus").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.status = b.dataset.v; dlg.querySelectorAll("#mStatus button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelector("#mPriority").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.priority = b.dataset.v; dlg.querySelectorAll("#mPriority button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));

    const deleteBtn = dlg.querySelector("#mDelete");
    if (deleteBtn) deleteBtn.addEventListener("click", () => {
      if (confirm("Delete this task?")) { state.tasks = state.tasks.filter(t => t.id !== draft.id); save(); dlg.close(); toast("Task deleted"); renderPage(); }
    });

    dlg.querySelector("#mSave").addEventListener("click", () => {
      const name = dlg.querySelector("#mName").value.trim(); if (!name) { dlg.querySelector("#mName").focus(); return; }
      const projectId = dlg.querySelector("#mProject").value || null;
      const proj = projectId ? projectById(projectId) : null;
      const wasStatus = draft.id ? (taskById(draft.id) || {}).status : null;
      const payload = {
        id: draft.id || uid(), projectId, venueId: proj ? proj.venueId : draft.venueId,
        name, ownerName: dlg.querySelector("#mOwnerName").value.trim(), ownerEmail: dlg.querySelector("#mOwnerEmail").value.trim(),
        startDate: dlg.querySelector("#mStart").value || null, dueDate: dlg.querySelector("#mDue").value || null,
        status: draft.status, priority: draft.priority, dependsOnTaskId: dlg.querySelector("#mDep").value || null,
        boardInputRequired: dlg.querySelector("#mBoard").checked, notes: dlg.querySelector("#mNotes").value,
        checklist: draft.checklist, createdAt: draft.createdAt || Date.now(),
      };
      const checklistTotal = payload.checklist.length;
      const checklistDone = payload.checklist.filter(c => c.done).length;
      payload.progressPct = payload.status === "Done" ? 100 : payload.status === "Not Started" ? 0 : checklistTotal ? Math.round((checklistDone / checklistTotal) * 100) : (draft.progressPct || 0);
      const idx = state.tasks.findIndex(t => t.id === payload.id);
      if (idx >= 0) state.tasks[idx] = payload; else state.tasks.push(payload);
      save(); dlg.close(); toast(isEdit ? "Task updated" : "Task added");
      renderPage();
      if (payload.status === "Done" && wasStatus !== "Done") {
        requestAnimationFrame(() => { const barEl = document.querySelector(`[data-task-id="${payload.id}"]`); const bar = barEl && barEl.closest(".g-bar"); if (bar) bar.classList.add("just-completed"); });
      }
    });
  }

  /* ============================== PROJECT MODAL ============================== */
  function openProjectModal(id) {
    const dlg = document.getElementById("projectDialog");
    const existing = id ? projectById(id) : null;
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: null, name: "", venueId: state.venues[0] ? state.venues[0].id : null, category: "Other", owner: "",
      status: "Not Started", budgetAllocated: 0, startDate: todayISO(), targetEndDate: "", actualEndDate: "",
      licenceRiskFlag: false, gamingFloorDisruption: false,
    };

    dlg.innerHTML = `
      <div class="modal-head"><h3>${existing ? "Edit project" : "New project"}</h3><button class="icon-x" data-close>${ICON.x}</button></div>
      <div class="modal-body">
        <div class="field"><label>Project name</label><input type="text" id="pName" value="${escapeHtml(draft.name)}" required /></div>
        <div class="field-row">
          <div class="field"><label>Venue</label><select id="pVenue">${state.venues.map(v => `<option value="${v.id}" ${draft.venueId === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select></div>
          <div class="field"><label>Category</label><select id="pCategory">${CATEGORIES.map(c => `<option value="${c}" ${draft.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>Owner</label><input type="text" id="pOwner" value="${escapeHtml(draft.owner)}" placeholder="e.g. Venue Director, Dalkia" /></div>
        <div class="field"><label>Status</label><div class="status-pick" id="pStatus">${STATUSES.map(s => `<button type="button" data-v="${s}" class="${draft.status === s ? "active" : ""}">${s}</button>`).join("")}</div></div>
        <div class="field-row">
          <div class="field"><label>Start date</label><input type="date" id="pStart" value="${draft.startDate || ""}" /></div>
          <div class="field"><label>Target end date</label><input type="date" id="pEnd" value="${draft.targetEndDate || ""}" /></div>
        </div>
        <div class="field"><label>Budget allocated (£)</label><input type="number" id="pBudget" value="${draft.budgetAllocated || 0}" min="0" step="100" /></div>
        <div class="toggle-row"><span>Licence risk<div class="hint">Delay here threatens a statutory/licensing deadline</div></span><label class="switch"><input type="checkbox" id="pLicence" ${draft.licenceRiskFlag ? "checked" : ""} /><span class="track"></span></label></div>
        <div class="toggle-row"><span>Gaming floor disruption<div class="hint">This project affects gaming floor availability</div></span><label class="switch"><input type="checkbox" id="pDisrupt" ${draft.gamingFloorDisruption ? "checked" : ""} /><span class="track"></span></label></div>
      </div>
      <div class="modal-foot">
        <div>${existing ? `<button class="btn btn-ghost modal-danger" id="pDelete">${ICON.trash} Delete</button>` : "<span></span>"}</div>
        <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn btn-accent" id="pSave">Save</button></div>
      </div>
    `;
    dlg.querySelector("#pStatus").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.status = b.dataset.v; dlg.querySelectorAll("#pStatus button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));
    const deleteBtn = dlg.querySelector("#pDelete");
    if (deleteBtn) deleteBtn.addEventListener("click", () => {
      if (confirm("Delete this project? Its tasks will become standalone (unassigned).")) {
        state.tasks.forEach(t => { if (t.projectId === draft.id) { t.projectId = null; t.venueId = draft.venueId; } });
        state.projects = state.projects.filter(p => p.id !== draft.id);
        save(); dlg.close(); toast("Project deleted"); renderPage();
      }
    });
    dlg.querySelector("#pSave").addEventListener("click", () => {
      const name = dlg.querySelector("#pName").value.trim(); if (!name) { dlg.querySelector("#pName").focus(); return; }
      const payload = {
        id: draft.id || uid(), name, venueId: dlg.querySelector("#pVenue").value, category: dlg.querySelector("#pCategory").value,
        owner: dlg.querySelector("#pOwner").value.trim(), status: draft.status, budgetAllocated: Number(dlg.querySelector("#pBudget").value) || 0,
        startDate: dlg.querySelector("#pStart").value || null, targetEndDate: dlg.querySelector("#pEnd").value || null, actualEndDate: draft.actualEndDate || null,
        licenceRiskFlag: dlg.querySelector("#pLicence").checked, gamingFloorDisruption: dlg.querySelector("#pDisrupt").checked,
      };
      const idx = state.projects.findIndex(p => p.id === payload.id);
      if (idx >= 0) state.projects[idx] = payload; else state.projects.push(payload);
      save(); dlg.close(); toast(existing ? "Project updated" : "Project added"); renderPage();
    });
    dlg.showModal();
  }

  /* ============================== COST MODAL ============================== */
  function openCostModal() {
    const dlg = document.getElementById("costDialog");
    if (!state.projects.length) { toast("Add a project first"); return; }
    dlg.innerHTML = `
      <div class="modal-head"><h3>Log a cost</h3><button class="icon-x" data-close>${ICON.x}</button></div>
      <div class="modal-body">
        <div class="field"><label>Project</label><select id="cProject">${state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Description</label><input type="text" id="cDesc" required /></div>
        <div class="field-row">
          <div class="field"><label>Supplier</label><input type="text" id="cSupplier" placeholder="e.g. Dalkia" /></div>
          <div class="field"><label>Amount (£)</label><input type="number" id="cAmount" min="0" step="1" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="cDate" value="${todayISO()}" /></div>
          <div class="field"><label>Category</label><input type="text" id="cCategory" placeholder="e.g. M&E, PPM, Reactive" /></div>
        </div>
      </div>
      <div class="modal-foot"><span></span><div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn btn-accent" id="cSave">Save</button></div></div>
    `;
    dlg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));
    dlg.querySelector("#cSave").addEventListener("click", () => {
      const description = dlg.querySelector("#cDesc").value.trim(); if (!description) { dlg.querySelector("#cDesc").focus(); return; }
      state.budgetLines.push({
        id: uid(), projectId: dlg.querySelector("#cProject").value, description,
        supplier: dlg.querySelector("#cSupplier").value.trim(), amount: Number(dlg.querySelector("#cAmount").value) || 0,
        dateLogged: dlg.querySelector("#cDate").value || todayISO(), category: dlg.querySelector("#cCategory").value.trim(),
      });
      save(); dlg.close(); toast("Cost logged"); renderPage();
    });
    dlg.showModal();
  }

  /* ============================== INIT ============================== */
  renderNav();
  renderPage();
})();
</script>
