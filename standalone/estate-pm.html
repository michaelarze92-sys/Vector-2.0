  * { box-sizing: border-box; }
  html, body { height: 100%; }

  /* ---------- Shell layout ---------- */
  .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  .nav {
    width: 216px; flex: none; background: var(--felt); color: var(--felt-ink);

  .nav-item svg { flex: none; opacity: 0.85; }

  .nav-foot { padding: 10px; font-size: 11px; color: var(--felt-ink-muted); line-height: 1.5; }
  .theme-toggle { display: inline-flex; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 3px; gap: 2px; margin-bottom: 8px; }
  .theme-toggle button { border: none; background: none; padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--felt-ink-muted); cursor: pointer; }
  .theme-toggle button.active { background: rgba(255,255,255,0.16); color: var(--felt-ink); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .quickadd { flex: 1; display: flex; align-items: center; gap: 8px; }

    flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px;
  }
  .quickadd input[type="text"]:focus { border-color: var(--accent); background: var(--surface); }
  .quickadd select, .quickadd input[type="date"] {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-secondary);
    border-radius: var(--radius-sm); padding: 8px 8px; font-size: 13px; max-width: 132px;
  }
  .btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { filter: brightness(1.06); }
  .btn-ghost { border-color: transparent; background: transparent; }

  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .content { flex: 1; overflow-y: auto; padding: 22px 26px 60px; }
  .page { display: none; max-width: 1320px; margin: 0 auto; }
  .page.active { display: block; }

  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; letter-spacing: -0.2px; text-wrap: balance; }
  .page-head .desc { font-size: 13px; color: var(--ink-muted); margin-top: 3px; }
  .page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ---------- Stat tiles ---------- */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 900px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .stat-tile .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-muted); font-weight: 600; }

  .stat-tile .value.accent-good { color: var(--st-done); }

  /* ---------- Cards / sections ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

  .card-body { padding: 6px 8px; }

  .empty-state { padding: 34px 20px; text-align: center; color: var(--ink-muted); font-size: 13.5px; }
  .empty-state .btn { margin-top: 10px; }

  /* ---------- Task row (list contexts: dashboard, calendar day) ---------- */
  .task-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .task-row:hover { background: var(--surface-2); }
  .task-row .status-dot { flex: none; }
  .task-row .t-main { flex: 1; min-width: 0; }
  .task-row .t-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-row .t-meta { font-size: 11.5px; color: var(--ink-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-row .t-due { flex: none; font-size: 12px; font-weight: 600; text-align: right; min-width: 78px; }
  .task-row.overdue-row { border-left: 3px solid var(--st-blocked); background: var(--st-blocked-soft); }
  .task-row.overdue-row:hover { filter: brightness(0.98); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
  }
  .chip svg { flex: none; }
  .chip-notstarted { background: var(--st-notstarted-soft); color: var(--st-notstarted); }
  .chip-inprogress { background: var(--st-inprogress-soft); color: var(--st-inprogress); }
  .chip-blocked { background: var(--st-blocked-soft); color: var(--st-blocked); }
  .chip-done { background: var(--st-done-soft); color: var(--st-done); }

  .pr-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; }
  .pr-flag.pr-Critical { color: var(--pr-critical); }
  .pr-flag.pr-High { color: var(--pr-high); }
  .pr-flag.pr-Medium { color: var(--pr-medium); }
  .pr-flag.pr-Low { color: var(--pr-low); }

  /* ---------- Gantt ---------- */
  .gantt-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .zoom-toggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .zoom-toggle button {
    border: none; background: none; padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-secondary); cursor: pointer;
  }
  .zoom-toggle button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .gantt-legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .gantt-legend .item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-secondary); font-weight: 600; }
  .gantt-legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .gantt-scroll { overflow: auto; position: relative; }
  .gantt-inner { position: relative; }
  .gantt-header-row { display: flex; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--border); }
  .gantt-header-spacer { position: sticky; left: 0; z-index: 4; background: var(--surface); flex: none; width: 268px; border-right: 1px solid var(--border); }
  .gantt-tick { flex: none; position: relative; padding: 8px 0 8px 8px; font-size: 11px; font-weight: 700; color: var(--ink-muted); border-right: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.3px; }
  .gantt-body { display: flex; position: relative; }
  .gantt-rowlabels { flex: none; width: 268px; position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--border); }
  .gantt-timeline { position: relative; flex: none; }

  .g-row { display: flex; align-items: center; height: 44px; border-bottom: 1px solid var(--border); }
  .g-row.group-venue { background: var(--felt); color: var(--felt-ink); }
  .g-row.group-venue .g-count { color: var(--felt-ink-muted); }
  .g-row.group-project { background: var(--surface-2); }
  .g-rowlabel { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px 0 8px; border-bottom: 1px solid var(--border); overflow: hidden; }
  .g-rowlabel.group-venue { background: var(--felt); color: var(--felt-ink); }
  .g-rowlabel.group-project { background: var(--surface-2); }
  .g-collapse { flex: none; background: none; border: none; cursor: pointer; color: inherit; opacity: 0.75; padding: 4px; display: flex; }
  .g-collapse:hover { opacity: 1; }
  .g-collapse svg { transition: transform 0.15s ease; }
  .g-collapse.collapsed svg { transform: rotate(-90deg); }
  .g-label-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .g-label-name.task-label { font-weight: 600; font-size: 12.5px; padding-left: 20px; }
  .g-count { font-size: 11px; color: var(--ink-muted); font-weight: 600; flex: none; }
  .g-icon-flag { flex: none; display: inline-flex; opacity: 0.9; }

  .gantt-gridline { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--border); }
  .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
  .gantt-today .flag {
    position: sticky; top: 34px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; display: inline-block; margin-top: 2px;
  }

  .g-bar-track { position: absolute; }
  .g-bar {
    position: absolute; top: 0; bottom: 0; border-radius: 7px; cursor: grab; overflow: hidden;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.08);
  }
  .g-bar:active { cursor: grabbing; }
  .g-bar.st-notstarted { background: var(--st-notstarted-soft); border-color: var(--st-notstarted); }
  .g-bar.st-inprogress { background: var(--st-inprogress-soft); border-color: var(--st-inprogress); }
  .g-bar.st-blocked { background: var(--st-blocked-soft); border-color: var(--st-blocked); }
  .g-bar.st-done { background: var(--st-done-soft); border-color: var(--st-done); }
  .g-bar-fill { position: absolute; inset: 0; width: 0%; border-radius: 6px 0 0 6px; opacity: 0.55; }
  .g-bar.st-notstarted .g-bar-fill { background: var(--st-notstarted); }
  .g-bar.st-inprogress .g-bar-fill { background: var(--st-inprogress); }
  .g-bar.st-blocked .g-bar-fill { background: var(--st-blocked); }
  .g-bar.st-done .g-bar-fill { background: var(--st-done); }
  .g-bar-label {
    position: relative; z-index: 1; font-size: 11.5px; font-weight: 700; padding: 0 8px; line-height: 24px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); display: block;
  }
  .g-bar-handle { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 2; }
  .g-bar-handle.left { left: 0; } .g-bar-handle.right { right: 0; }
  .g-milestone { position: absolute; top: 4px; width: 16px; height: 16px; transform: translateX(-8px) rotate(45deg); cursor: grab; }
  .g-milestone.st-notstarted { background: var(--st-notstarted); }
  .g-milestone.st-inprogress { background: var(--st-inprogress); }
  .g-milestone.st-blocked { background: var(--st-blocked); }
  .g-milestone.st-done { background: var(--st-done); }

  .g-bar.just-completed { animation: bar-pop 0.5s ease; }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes bar-pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); box-shadow: 0 0 0 6px var(--st-done-soft); }
      100% { transform: scale(1); box-shadow: none; }
    }
  }
  @media (prefers-reduced-motion: reduce) { .g-bar.just-completed { animation: none; } }

  .g-dep-line { stroke: var(--ink-muted); stroke-width: 1.5; fill: none; opacity: 0.55; }
  .g-dep-arrow { fill: var(--ink-muted); opacity: 0.55; }

  /* ---------- Budget ---------- */
  .budget-card { padding: 14px 16px; }
  .budget-project-row { padding: 14px 4px; border-bottom: 1px solid var(--border); }
  .budget-project-row:last-child { border-bottom: none; }
  .bp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .bp-name { font-size: 14px; font-weight: 700; }
  .bp-venue { font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
  .bp-figures { font-size: 12.5px; color: var(--ink-secondary); font-weight: 600; text-align: right; }
  .bp-bar-track { height: 12px; border-radius: 6px; background: var(--surface-2); position: relative; overflow: hidden; border: 1px solid var(--border); }
  .bp-bar-fill { position: absolute; inset: 0; width: 0%; border-radius: 6px; background: var(--st-inprogress); }
  .bp-bar-fill.over { background: var(--st-blocked); }

  };
  const STATUS_ICON = { "Not Started": ICON.circle, "In Progress": ICON.play, "Blocked": ICON.stop, "Done": ICON.check };
  const STATUS_CLASS = { "Not Started": "notstarted", "In Progress": "inprogress", "Blocked": "blocked", "Done": "done" };
  const STATUSES = ["Not Started", "In Progress", "Blocked", "Done"];
  const PRIORITIES = ["Low", "Medium", "High", "Critical"];
  const CATEGORIES = ["Compliance", "Refurbishment", "Contractor-Managed", "Licensing", "Other"];
  const STAGE_GATES = ["Concept", "Business Case", "Approved", "Procurement/Tender", "Delivery", "Close-out"];
  function stageGateChip(stage) {
    stage = stage || STAGE_GATES[0];
    const idx = STAGE_GATES.indexOf(stage);
    const cls = idx <= 1 ? "chip-notstarted" : idx <= 4 ? "chip-inprogress" : "chip-done";
    return `<span class="chip ${cls}" title="Stage gate">${escapeHtml(stage)}</span>`;
  }

  /* ============================== DATE UTILS ============================== */
  const DAY_MS = 86400000;
  function pad2(n) { return String(n).padStart(2, "0"); }
  function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseISO(s) { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / DAY_MS); }
  function todayISO() { return toISO(new Date()); }
  function fmtShort(iso) { if (!iso) return "—"; const d = parseISO(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  function fmtLong(iso) { if (!iso) return "—"; const d = parseISO(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
  function money(n) { n = Number(n) || 0; return "£" + n.toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ============================== STATE ============================== */
  const STORE_KEY = "metroEstatesPM.v1";
  const SEED_VENUES = [
    { id: "v1", code: "v1", name: "The Empire (Leicester Sq)", region: "London" },
    { id: "v2", code: "v2", name: "Metropolitan Mayfair", region: "London" },
    { id: "v3", code: "v3", name: "Park Lane Club", region: "London" },
    { id: "v4", code: "v4", name: "The Sportsman (Marble Arch)", region: "London" },
    { id: "v5", code: "v5", name: "Alea Glasgow", region: "Northern" },
    { id: "v6", code: "v6", name: "Manchester 235", region: "Northern" },
    { id: "v7", code: "v7", name: "Alea Nottingham", region: "Northern" },
  ];

  function freshState() {
    return { venues: SEED_VENUES.map(v => ({ ...v })), projects: [], tasks: [], budgetLines: [],
      contacts: [], qaItems: [], documents: [], decisions: [], risks: [], meetingNotes: [], tenders: [], budgetCheckpoints: [], lessons: [],
      ui: { collapsed: {}, ganttZoom: "week", calMonth: todayISO().slice(0, 7), kanbanFilter: {} } };
  }

  let state = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return freshState();
      const parsed = JSON.parse(raw);
      const fresh = freshState();
      return Object.assign(fresh, parsed, { ui: Object.assign(fresh.ui, parsed.ui || {}) });
    } catch (e) { console.error("Failed to load saved data, starting fresh.", e); return freshState(); }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  /* ---------- Theme (separate from app state — a display setting, not data) ---------- */
  const THEME_KEY = "metroEstatesPM.theme"; // "light" | "dark" | absent = follow system
  function getTheme() { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; } }
  function applyTheme(theme) {
    const root = document.documentElement;
    if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
    else root.removeAttribute("data-theme");
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      const dark = theme === "dark" || (theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      meta.setAttribute("content", dark ? "#0e2119" : "#123526");
    }
  }
  function setTheme(theme) {
    try { theme === "auto" ? localStorage.removeItem(THEME_KEY) : localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    applyTheme(theme);
    renderNav();
  }
  applyTheme(getTheme());

  function venueById(id) { return state.venues.find(v => v.id === id); }
  function projectById(id) { return state.projects.find(p => p.id === id); }
  function taskById(id) { return state.tasks.find(t => t.id === id); }
  function projectVenueId(p) { return p ? p.venueId : null; }
  function projectSpend(projectId) {
    return state.budgetLines.filter(b => b.projectId === projectId).reduce((s, b) => s + (Number(b.amount) || 0), 0);
  }
  function isOverdue(t) { return t.dueDate && t.dueDate < todayISO() && t.status !== "Done"; }
  function isDueThisWeek(t) { if (!t.dueDate || t.status === "Done") return false; const diff = daysBetween(todayISO(), t.dueDate); return diff >= 0 && diff <= 7; }

  function allDatedItems() {
    const items = [];
    state.tasks.forEach(t => {
      items.push({ kind: "task", dueDate: t.dueDate, done: t.status === "Done", task: t, item: null });
      (t.checklist || []).forEach(c => { if (c.dueDate) items.push({ kind: "subtask", dueDate: c.dueDate, done: c.done, task: t, item: c }); });
    });
    return items;
  }
  function itemOverdue(x) { return x.dueDate && x.dueDate < todayISO() && !x.done; }
  function itemDueThisWeek(x) { if (!x.dueDate || x.done) return false; const diff = daysBetween(todayISO(), x.dueDate); return diff >= 0 && diff <= 7; }

  function projectTasks(id) { return state.tasks.filter(t => t.projectId === id); }
  function projectContacts(id) { return state.contacts.filter(c => c.projectId === id); }
  function projectQA(id) { return state.qaItems.filter(q => q.projectId === id); }
  function projectDocuments(id) { return state.documents.filter(d => d.projectId === id); }
  function projectDecisions(id) { return state.decisions.filter(d => d.projectId === id); }
  function projectRisks(id) { return state.risks.filter(r => r.projectId === id); }
  function openRiskCount(id) { return projectRisks(id).filter(r => r.status === "Open").length; }
  function projectMeetingNotes(id) { return state.meetingNotes.filter(n => n.projectId === id); }
  function projectTenders(id) { return state.tenders.filter(t => t.projectId === id); }
  function projectBudgetCheckpoints(id) { return state.budgetCheckpoints.filter(b => b.projectId === id); }

  function projectLessons(id) { return state.lessons.filter(l => l.projectId === id); }

  // Kanban-style WIP check: too many things genuinely in flight at once for one person.
  // Counts tasks and delegated subtasks together — a subtask you've handed to someone
  // is still load on them, even though it isn't a task in its own right.
  const WIP_LIMIT = 5;
  function wipByOwner() {
    const counts = {};
    const bump = (name) => { const n = (name || "").trim(); if (!n) return; counts[n] = (counts[n] || 0) + 1; };
    state.tasks.forEach(t => {
      if (t.status === "In Progress") bump(t.ownerName);
      (t.checklist || []).forEach(c => { if (!c.done) bump(c.assigneeName); });
    });
    return Object.keys(counts).map(owner => ({ owner, count: counts[owner] })).sort((a, b) => b.count - a.count);
  }

  /* ============================== NAV ============================== */

  function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  /* ============================== DASHBOARD ============================== */
  function renderDashboard() {
    const tasks = state.tasks;
    const items = allDatedItems();
    const overdue = items.filter(itemOverdue).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    const dueWeek = items.filter(x => itemDueThisWeek(x) && !itemOverdue(x)).sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
    const openTasks = tasks.filter(t => t.status !== "Done").length;
    const inProgressProjects = state.projects.filter(p => p.status === "In Progress").length;
    const budgetAlerts = state.projects.map(p => ({ p, spend: projectSpend(p.id) }))
      .filter(x => x.p.budgetAllocated > 0 && x.spend / x.p.budgetAllocated >= 0.85)
      .sort((a, b) => (b.spend / b.p.budgetAllocated) - (a.spend / a.p.budgetAllocated));

    const wipOverloaded = wipLoads.filter(w => w.count > WIP_LIMIT);

    return `

        <div class="stat-tile"><div class="label">Due this week</div><div class="value ${dueWeek.length ? "accent-warn" : ""}">${dueWeek.length}</div><div class="sub">next 7 days</div></div>

        <div class="stat-tile"><div class="label">Budget alerts</div><div class="value ${budgetAlerts.length ? "accent-bad" : "accent-good"}">${budgetAlerts.length}</div><div class="sub">projects ≥85% of budget</div></div>
      </div>

      ${wipOverloaded.length ? `<div class="banner banner-warn" style="margin-bottom:16px">
        ${wipOverloaded.map(w => `<div><strong>${escapeHtml(w.owner)}</strong> has ${w.count} tasks in progress at once (over ${WIP_LIMIT}) — worth finishing something before pulling in more.</div>`).join("")}
      </div>` : ""}

      <div class="card">

      </div>
    `;

  function budgetAlertRow(x) {
    const pct = Math.round((x.spend / x.p.budgetAllocated) * 100);

    return `<div class="task-row" data-open-project="${x.p.id}" style="cursor:pointer">

  function taskRowHtml(t, overdueStyle) {
    const proj = projectById(t.projectId);

  function datedItemRowHtml(x, overdueStyle) {

    const t = x.task, c = x.item;

  /* ============================== GANTT ============================== */
  const ZOOM_CFG = {
    day: { pxPerDay: 46, unit: "day" },
    week: { pxPerDay: 17, unit: "week" },
    month: { pxPerDay: 5.5, unit: "month" },
    quarter: { pxPerDay: 2, unit: "quarter" },
  };

  function ganttRange() {
    let min = null, max = null;
    state.projects.forEach(p => { if (p.startDate) min = min ? (p.startDate < min ? p.startDate : min) : p.startDate; if (p.targetEndDate) max = max ? (p.targetEndDate > max ? p.targetEndDate : max) : p.targetEndDate; });
    state.tasks.forEach(t => { if (t.startDate) min = min ? (t.startDate < min ? t.startDate : min) : t.startDate; if (t.dueDate) max = max ? (t.dueDate > max ? t.dueDate : max) : t.dueDate; });
    const today = todayISO();
    if (!min) min = addDays(today, -14);
    if (!max) max = addDays(today, 60);
    if (today < min) min = today; if (today > max) max = today;
    min = addDays(min, -7); max = addDays(max, 21);
    return { start: min, end: max };
  }

  function genTicks(zoom, range) {
    const ticks = []; const cfg = ZOOM_CFG[zoom];
    if (zoom === "day") {
      let cur = range.start;
      while (cur <= range.end) {
        const d = parseISO(cur);
        ticks.push({ x: daysBetween(range.start, cur) * cfg.pxPerDay, w: cfg.pxPerDay, label: d.toLocaleDateString(undefined, { weekday: "short", day: "numeric" }) });
        cur = addDays(cur, 1);
      }
    } else if (zoom === "week") {
      let d = parseISO(range.start); const day = d.getDay(); const back = (day + 6) % 7; d.setDate(d.getDate() - back);
      let cur = toISO(d);
      while (cur <= range.end) {
        ticks.push({ x: daysBetween(range.start, cur) * cfg.pxPerDay, w: 7 * cfg.pxPerDay, label: fmtShort(cur) + " – " + fmtShort(addDays(cur, 6)) });
        cur = addDays(cur, 7);
      }
    } else if (zoom === "month") {
      let d = parseISO(range.start); d.setDate(1); let cur = toISO(d);
      while (cur <= range.end) {
        const dt = parseISO(cur); const nextMonth = new Date(dt.getFullYear(), dt.getMonth() + 1, 1);
        const wDays = Math.round((nextMonth - dt) / DAY_MS);
        ticks.push({ x: Math.max(0, daysBetween(range.start, cur)) * cfg.pxPerDay, w: wDays * cfg.pxPerDay, label: dt.toLocaleDateString(undefined, { month: "long", year: "numeric" }) });
        cur = toISO(nextMonth);
      }
    } else {
      let d = parseISO(range.start); const qStartMonth = Math.floor(d.getMonth() / 3) * 3; d = new Date(d.getFullYear(), qStartMonth, 1); let cur = toISO(d);
      while (cur <= range.end) {
        const dt = parseISO(cur); const nextQ = new Date(dt.getFullYear(), dt.getMonth() + 3, 1);
        const wDays = Math.round((nextQ - dt) / DAY_MS);
        ticks.push({ x: Math.max(0, daysBetween(range.start, cur)) * cfg.pxPerDay, w: wDays * cfg.pxPerDay, label: "Q" + (Math.floor(dt.getMonth() / 3) + 1) + " " + dt.getFullYear() });
        cur = toISO(nextQ);
      }
    }
    return ticks;
  }

  function groupKey(kind, id) { return kind + ":" + id; }
  function isCollapsed(key) { return !!state.ui.collapsed[key]; }

  function renderGantt() {
    const zoom = state.ui.ganttZoom; const cfg = ZOOM_CFG[zoom]; const range = ganttRange();
    const totalDays = daysBetween(range.start, range.end); const totalWidth = totalDays * cfg.pxPerDay;
    const ticks = genTicks(zoom, range);

    let rowsHtml = ""; let barsHtml = ""; let y = 0; const rowH = 44;
    const barPositions = {}; // taskId -> {x1,x2,y}

    function addRowLabel(html) { rowsHtml += html; }
    function addBarLayer(html) { barsHtml += html; }

    const hasAnything = state.venues.some(v => state.projects.some(p => p.venueId === v.id) || state.tasks.some(t => (t.venueId === v.id) && !t.projectId));
    const unassignedTasks = state.tasks.filter(t => !t.projectId && !t.venueId);

    state.venues.forEach(v => {
      const venueProjects = state.projects.filter(p => p.venueId === v.id);
      const venueLooseTasks = state.tasks.filter(t => !t.projectId && t.venueId === v.id);
      if (!venueProjects.length && !venueLooseTasks.length) return;
      const vKey = groupKey("venue", v.id); const vCollapsed = isCollapsed(vKey);
      addRowLabel(`<div class="g-rowlabel group-venue">
        <button class="g-collapse ${vCollapsed ? "collapsed" : ""}" data-toggle-group="${vKey}">${ICON.chevron}</button>
        <span class="g-label-name">${escapeHtml(v.name)}</span>
        <span class="g-count">${venueProjects.length + venueLooseTasks.length}</span>
      </div>`);
      addBarLayer(`<div class="g-row group-venue" style="width:${totalWidth}px"></div>`);
      y += rowH;
      if (!vCollapsed) {
        venueProjects.forEach(p => {
          const pKey = groupKey("project", p.id); const pCollapsed = isCollapsed(pKey);
          const projTasks = state.tasks.filter(t => t.projectId === p.id);
          addRowLabel(`<div class="g-rowlabel group-project">

          y += rowH;

    const totalHeight = y;

    });

    const gridlines = ticks.map(t => `<div class="gantt-gridline" style="left:${t.x}px;height:${totalHeight}px"></div>`).join("");

    const body = !hasAnything && !unassignedTasks.length ? emptyState("No projects or tasks yet. Use “+ New project” or the quick-add bar above to get started.") : `

  function renderTaskRow(t, range, cfg, totalWidth, y, barPositions) {
    const start = t.startDate || t.dueDate || todayISO();
    const due = t.dueDate || t.startDate || todayISO();
    const dur = Math.max(daysBetween(start, due), 0);
    const x1 = Math.max(0, daysBetween(range.start, start)) * cfg.pxPerDay;
    const cls = STATUS_CLASS[t.status];
    const label = `<div class="g-rowlabel"><span class="g-label-name task-label">${escapeHtml(t.name)}</span></div>`;
    let bar;
    if (dur === 0) {
      bar = `<div class="g-milestone st-${cls}" style="left:${x1}px;top:${y + 10}px" data-task-id="${t.id}" data-drag="move" title="${escapeHtml(t.name)}"></div>`;
      barPositions[t.id] = { x1, x2: x1, y: y + rowMid() };
    } else {
      const w = Math.max(dur * cfg.pxPerDay, 14);
      bar = `<div class="g-bar-track" style="left:${x1}px;width:${w}px;top:${y + 7}px;height:30px">
        <div class="g-bar st-${cls}" data-task-id="${t.id}" data-drag="move" title="${escapeHtml(t.name)} — ${fmtShort(start)} to ${fmtShort(due)}">
          <div class="g-bar-fill" style="width:${Math.max(0, Math.min(100, t.progressPct || 0))}%"></div>
          <span class="g-bar-label">${escapeHtml(t.name)}</span>
          <div class="g-bar-handle left" data-task-id="${t.id}" data-drag="start"></div>
          <div class="g-bar-handle right" data-task-id="${t.id}" data-drag="end"></div>
        </div>
      </div>`;
      barPositions[t.id] = { x1, x2: x1 + w, y: y + rowMid() };
    }
    return { label, bar };
    function rowMid() { return 22; }
  }

  /* ---- Gantt interactions: zoom, collapse, drag ---- */
  function bindGanttEvents(root) {
    root.querySelectorAll("[data-zoom]").forEach(btn => btn.addEventListener("click", () => { state.ui.ganttZoom = btn.dataset.zoom; save(); renderPage(); }));
    root.querySelectorAll("[data-toggle-group]").forEach(btn => btn.addEventListener("click", () => {
      const k = btn.dataset.toggleGroup; state.ui.collapsed[k] = !state.ui.collapsed[k]; save(); renderPage();
    }));
    const timeline = root.querySelector(".gantt-timeline");
    if (!timeline) return;
    const cfg = ZOOM_CFG[state.ui.ganttZoom];
    root.querySelectorAll("[data-drag]").forEach(el => {
      el.addEventListener("pointerdown", (e) => startDrag(e, el, cfg));
    });
    root.querySelectorAll(".g-bar-label, .g-bar, .g-milestone").forEach(el => {
      el.addEventListener("click", (e) => { if (el._dragged) { el._dragged = false; return; } const id = el.dataset.taskId || el.closest("[data-task-id]").dataset.taskId; openTaskModal(id); });
    });
    // scroll to today on first paint
    const scrollWrap = root.querySelector(".gantt-scroll");
    if (scrollWrap && !scrollWrap._scrolled) {
      const flag = root.querySelector(".gantt-today");
      if (flag) { const left = parseFloat(flag.style.left) - 220; scrollWrap.scrollLeft = Math.max(0, left); }
      scrollWrap._scrolled = true;
    }
  }

  function startDrag(e, el, cfg) {
    e.preventDefault(); e.stopPropagation();
    const taskId = el.dataset.taskId; const t = taskById(taskId); if (!t) return;
    const mode = el.dataset.drag; const startX = e.clientX;
    const origStart = t.startDate || t.dueDate || todayISO(); const origDue = t.dueDate || t.startDate || todayISO();
    let lastDelta = 0; el._dragged = false;
    const barEl = mode === "move" ? el : el.closest(".g-bar") || el;
    function onMove(ev) {
      const deltaPx = ev.clientX - startX; const deltaDays = Math.round(deltaPx / cfg.pxPerDay);
      if (deltaDays === lastDelta) return; lastDelta = deltaDays; el._dragged = true;
      barEl.style.transition = "none";
      if (mode === "move") { barEl.parentElement.style.transform = `translateX(${deltaDays * cfg.pxPerDay}px)`; }
      else if (mode === "start") { const w = parseFloat(barEl.parentElement.style.width); barEl.parentElement.style.transform = `translateX(${deltaDays * cfg.pxPerDay}px)`; barEl.parentElement.style.width = Math.max(14, w - deltaDays * cfg.pxPerDay) + "px"; }
      else { const w = parseFloat(barEl.parentElement.style.width); barEl.parentElement.style.width = Math.max(14, w + deltaDays * cfg.pxPerDay) + "px"; }
    }
    function onUp() {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp);
      if (lastDelta !== 0) {
        if (mode === "move") { t.startDate = addDays(origStart, lastDelta); t.dueDate = addDays(origDue, lastDelta); }
        else if (mode === "start") { let ns = addDays(origStart, lastDelta); if (ns > (t.dueDate || origDue)) ns = t.dueDate || origDue; t.startDate = ns; }
        else { let nd = addDays(origDue, lastDelta); if (nd < (t.startDate || origStart)) nd = t.startDate || origStart; t.dueDate = nd; }
        save(); renderPage();
      } else if (barEl.parentElement) { barEl.parentElement.style.transform = ""; }
    }
    window.addEventListener("pointermove", onMove); window.addEventListener("pointerup", onUp, { once: true });
  }

  const PROJECT_LOG_ENTITIES = [
    { key: "risks", addAttr: "data-add-risk", delAttr: "data-delete-risk", fields: ["risk", "likelihood", "impact", "mitigation", "owner", "status"] },
    { key: "decisions", addAttr: "data-add-decision", delAttr: "data-delete-decision", fields: ["date", "decision", "reason", "decidedBy", "impact"] },
    { key: "qaItems", addAttr: "data-add-qa", delAttr: "data-delete-qa", fields: ["date", "askedOf", "question", "answer", "status", "followUp"] },
    { key: "documents", addAttr: "data-add-document", delAttr: "data-delete-document", fields: ["dateReceived", "name", "type", "source", "location", "notes"] },
    { key: "contacts", addAttr: "data-add-contact", delAttr: "data-delete-contact", fields: ["name", "orgRole", "area", "phone", "email", "notes"] },
    { key: "meetingNotes", addAttr: "data-add-meetingnote", delAttr: "data-delete-meetingnote", fields: ["date", "title", "source", "body"] },
    { key: "tenders", addAttr: "data-add-tender", delAttr: "data-delete-tender", fields: ["title", "route", "status", "issueDate", "returnDate", "estValue", "owner"] },
    { key: "budgetCheckpoints", addAttr: "data-add-budgetcheckpoint", delAttr: "data-delete-budgetcheckpoint", fields: ["stage", "amount", "date", "notes"] },
    { key: "lessons", addAttr: "data-add-lesson", delAttr: "data-delete-lesson", fields: ["date", "theme", "whatHappened", "doDifferently", "raisedBy"] },
  ];

  function bindProjectDetailEvents(root) {
    const backBtn = root.querySelector('[data-action="back-to-projects"]'); if (backBtn) backBtn.addEventListener("click", () => go("projects"));
    const editBtn = root.querySelector('[data-action="edit-project"]'); if (editBtn) editBtn.addEventListener("click", () => openProjectModal(editBtn.dataset.id));

    PROJECT_LOG_ENTITIES.forEach(cfg => {
      const form = root.querySelector(`[${cfg.addAttr}]`);
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const projectId = form.getAttribute(cfg.addAttr);
          const fd = new FormData(form);
          const record = { id: uid(), projectId };
          cfg.fields.forEach(f => { record[f] = (fd.get(f) || "").toString().trim(); });
          state[cfg.key].push(record);
          save(); toast("Added"); renderPage();
        });
      }
      root.querySelectorAll(`[${cfg.delAttr}]`).forEach(btn => btn.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation(); // a delete button inside a <summary> must not also toggle it open/closed
        const recId = btn.getAttribute(cfg.delAttr);
        state[cfg.key] = state[cfg.key].filter(r => r.id !== recId);
        save(); renderPage();
      }));
    });
  }

  /* ============================== BUDGET ============================== */
  function renderBudget() {
    const totalAllocated = state.projects.reduce((s, p) => s + (Number(p.budgetAllocated) || 0), 0);
    const totalSpent = state.projects.reduce((s, p) => s + projectSpend(p.id), 0);
    return `
      <div class="page-head">
        <div><h1>Budget</h1><div class="desc">Allocated vs. spent per project, with burn-rate against the schedule.</div></div>
        <div class="page-actions"><button class="btn" data-action="log-cost">${ICON.plus} Log a cost</button></div>
      </div>
      <div class="stat-row">
        <div class="stat-tile"><div class="label">Total allocated</div><div class="value">${money(totalAllocated)}</div></div>
        <div class="stat-tile"><div class="label">Total spent</div><div class="value">${money(totalSpent)}</div></div>
        <div class="stat-tile"><div class="label">Variance</div><div class="value ${totalSpent > totalAllocated ? "accent-bad" : "accent-good"}">${money(totalAllocated - totalSpent)}</div><div class="sub">${totalSpent > totalAllocated ? "over" : "remaining"}</div></div>
        <div class="stat-tile"><div class="label">Projects tracked</div><div class="value">${state.projects.length}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Projects</h2></div>
        <div class="card-body budget-card">
          ${state.projects.length ? state.projects.map(budgetRow).join("") : emptyState("No projects yet — add one from the Gantt page to start tracking budget.")}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Cost log</h2></div>
        <div class="table-wrap"><table class="data-table">
          <thead><tr><th>Date</th><th>Description</th><th>Supplier</th><th>Project</th><th>Category</th><th class="num">Amount</th></tr></thead>
          <tbody>${state.budgetLines.length ? [...state.budgetLines].sort((a, b) => b.dateLogged.localeCompare(a.dateLogged)).map(costRow).join("") : `<tr><td colspan="6">${emptyState("No costs logged yet.")}</td></tr>`}</tbody>
        </table></div>
      </div>
    `;
  }

  function budgetRow(p) {
    const spend = projectSpend(p.id); const alloc = Number(p.budgetAllocated) || 0;
    const pct = alloc > 0 ? (spend / alloc) * 100 : 0;
    const venue = venueById(p.venueId);
    let elapsedPct = null;
    if (p.startDate && p.targetEndDate) {
      const total = Math.max(daysBetween(p.startDate, p.targetEndDate), 1);
      const elapsed = Math.min(Math.max(daysBetween(p.startDate, todayISO()), 0), total);
      elapsedPct = (elapsed / total) * 100;
    }
    let burnLabel = "No schedule set", burnClass = "";
    if (elapsedPct !== null && alloc > 0) {
      if (pct <= elapsedPct + 5) { burnLabel = "On track"; burnClass = "burn-ontrack"; }
      else if (pct <= elapsedPct + 20) { burnLabel = "Trending over"; burnClass = "burn-watch"; }
      else { burnLabel = "Overspend risk"; burnClass = "burn-over"; }
    }
    return `<div class="budget-project-row" data-open-project="${p.id}" style="cursor:pointer">
      <div class="bp-head">
        <div><div class="bp-name">${escapeHtml(p.name)}</div><div class="bp-venue">${venue ? escapeHtml(venue.name) : "No venue"} · ${escapeHtml(p.category || "Other")}</div></div>
        <div class="bp-figures">${money(spend)} / ${money(alloc)}</div>
      </div>
      <div class="bp-bar-track">
        <div class="bp-bar-fill ${pct >= 100 ? "over" : pct >= 85 ? "warn" : ""}" style="width:${Math.min(pct, 100)}%"></div>
        ${elapsedPct !== null ? `<div class="bp-marker" style="left:${Math.min(elapsedPct, 100)}%" title="Schedule elapsed"></div>` : ""}
      </div>
      <div class="bp-foot"><span class="burn-chip ${burnClass}">${burnLabel}</span><span style="font-size:11.5px;color:var(--ink-muted)">${Math.round(pct)}% of budget used</span></div>
    </div>`;
  }

  function costRow(b) {
    const p = projectById(b.projectId);
    return `<tr><td>${fmtShort(b.dateLogged)}</td><td>${escapeHtml(b.description)}</td><td>${escapeHtml(b.supplier || "—")}</td><td>${p ? escapeHtml(p.name) : "—"}</td><td>${escapeHtml(b.category || "—")}</td><td class="num">${money(b.amount)}</td></tr>`;
  }

  /* ============================== CALENDAR ============================== */
  // Michael's documented reporting cadence — monthly FM dashboard, quarterly SHE pack
  // and ECT Board report. The day-of-month is a placeholder he can change on the
  // Calendar page (stored in state.ui.govDays); the *cadence* is the fixed part.
  const GOVERNANCE_CADENCE = [
    { key: "fm", label: "FM dashboard due", every: "month" },
    { key: "she", label: "Quarterly SHE pack", every: "quarter" },
    { key: "board", label: "ECT Board SHE report", every: "quarter" },
  ];
  const GOV_DAY_DEFAULTS = { fm: 5, she: 10, board: 15 };
  function govDays() { return Object.assign({}, GOV_DAY_DEFAULTS, state.ui.govDays || {}); }
  function governanceEventsForMonth(y, m) {
    if (state.ui.hideGovernance) return [];
    const days = govDays();
    const daysInMonth = new Date(y, m, 0).getDate();
    const isQuarterMonth = [1, 4, 7, 10].indexOf(m) >= 0;
    return GOVERNANCE_CADENCE
      .filter(g => g.every === "month" || isQuarterMonth)
      .map(g => ({ label: g.label, date: y + "-" + pad2(m) + "-" + pad2(Math.min(days[g.key], daysInMonth)) }));
  }

  function renderCalendar() {
    const [y, m] = state.ui.calMonth.split("-").map(Number);
    const first = new Date(y, m - 1, 1); const startDow = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m, 0).getDate();
    const gridStart = new Date(y, m - 1, 1 - startDow);
    const cells = [];
    for (let i = 0; i < 42; i++) { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); cells.push(d); }
    const monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const itemsByDay = {};
    state.tasks.forEach(t => {
      if (t.dueDate) (itemsByDay[t.dueDate] = itemsByDay[t.dueDate] || []).push({ kind: "task", task: t });
      (t.checklist || []).forEach(c => {
        if (c.dueDate) (itemsByDay[c.dueDate] = itemsByDay[c.dueDate] || []).push({ kind: "subtask", task: t, item: c });
      });
    });

    const gd = govDays();
    governanceEventsForMonth(y, m).forEach(g => {
      // unshift, not push: a board deadline must survive the slice(0, 3) truncation
      // in a day cell that also has ordinary tasks due.
      (itemsByDay[g.date] = itemsByDay[g.date] || []).unshift({ kind: "governance", label: g.label });
    });

    const dow = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const cellsHtml = cells.map(d => {
      const iso = toISO(d); const out = d.getMonth() !== m - 1; const isToday = iso === todayISO();
      const dayItems = itemsByDay[iso] || [];
      return `<div class="cal-cell ${out ? "out" : ""} ${isToday ? "today" : ""}">
        <div class="cal-daynum">${d.getDate()}</div>
        ${dayItems.slice(0, 3).map(x => {
          if (x.kind === "governance") {
            return `<div class="cal-chip cal-gov" style="background:var(--accent-soft);color:var(--accent-soft-ink);cursor:default" title="Governance milestone">${escapeHtml(x.label)}</div>`;
          }
          if (x.kind === "task") {
            return `<div class="cal-chip" style="background:var(--st-${STATUS_CLASS[x.task.status]}-soft);color:var(--st-${STATUS_CLASS[x.task.status]})" data-open-task="${x.task.id}">${escapeHtml(x.task.name)}</div>`;
          }
          const cls = x.item.done ? "done" : "notstarted";
          return `<div class="cal-chip" style="background:var(--st-${cls}-soft);color:var(--st-${cls})" data-open-task="${x.task.id}" title="Subtask of: ${escapeHtml(x.task.name)}">↳ ${escapeHtml(x.item.label)}</div>`;
        }).join("")}
        ${dayItems.length > 3 ? `<div class="cal-chip" style="color:var(--ink-muted)">+${dayItems.length - 3} more</div>` : ""}
      </div>`;
    }).join("");

    return `
      <div class="page-head">
        <div><h1>Calendar</h1><div class="desc">Tasks and subtasks by due date — click one to open its task. Gold chips are your recurring reporting deadlines.</div></div>
        <div class="page-actions">
          <button class="btn btn-sm" data-cal-nav="-1">‹ Prev</button>
          <strong style="min-width:140px;text-align:center;display:inline-block">${monthLabel}</strong>
          <button class="btn btn-sm" data-cal-nav="1">Next ›</button>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px"><div class="card-body pad">
        <div class="kb-filters">
          <strong style="font-size:12.5px">Governance cadence</strong>
          <label class="gov-day">FM dashboard, day <input type="number" min="1" max="28" value="${gd.fm}" data-gov-day="fm" /></label>
          <label class="gov-day">SHE pack, day <input type="number" min="1" max="28" value="${gd.she}" data-gov-day="she" /></label>
          <label class="gov-day">ECT Board, day <input type="number" min="1" max="28" value="${gd.board}" data-gov-day="board" /></label>
          <button class="btn btn-sm" data-gov-toggle>${state.ui.hideGovernance ? "Show" : "Hide"} on calendar</button>
        </div>
        <div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px">Monthly FM dashboard; SHE pack and ECT Board report each quarter (Jan/Apr/Jul/Oct). Set the days to match your real deadlines.</div>
      </div></div>
      <div class="card"><div class="card-body pad">
        <div class="cal-grid">
          ${dow.map(d => `<div class="cal-dow">${d}</div>`).join("")}
          ${cellsHtml}
        </div>
      </div></div>
    `;
  }

  /* ============================== KANBAN BOARD ============================== */
  function renderKanban() {
    const f = state.ui.kanbanFilter || {};
    let tasks = state.tasks.slice();
    if (f.projectId) tasks = tasks.filter(t => t.projectId === f.projectId);
    if (f.venueId) tasks = tasks.filter(t => (t.venueId || (projectById(t.projectId) || {}).venueId) === f.venueId);
    if (f.owner) tasks = tasks.filter(t => (t.ownerName || "") === f.owner);

    const owners = [...new Set(state.tasks.map(t => (t.ownerName || "").trim()).filter(Boolean))].sort();
    const cols = STATUSES.map(s => ({ status: s, items: tasks.filter(t => t.status === s) }));

    return `
      <div class="page-head">
        <div><h1>Board</h1><div class="desc">Drag a task between columns to change its status. Same tasks as the Gantt — a flow view instead of a timeline.</div></div>
      </div>
      <div class="card" style="margin-bottom:16px"><div class="card-body pad">
        <div class="kb-filters">
          <select data-kb-filter="projectId"><option value="">All projects</option>${state.projects.map(p => `<option value="${p.id}" ${f.projectId === p.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}</select>
          <select data-kb-filter="venueId"><option value="">All venues</option>${state.venues.map(v => `<option value="${v.id}" ${f.venueId === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select>
          <select data-kb-filter="owner"><option value="">All owners</option>${owners.map(o => `<option value="${escapeHtml(o)}" ${f.owner === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}</select>
          ${(f.projectId || f.venueId || f.owner) ? `<button class="btn btn-sm" data-kb-clear>Clear filters</button>` : ""}
        </div>
      </div></div>
      <div class="kanban-grid">
        ${cols.map(c => `
          <div class="kb-col" data-kb-col="${escapeHtml(c.status)}">
            <div class="kb-col-head">
              <span class="chip chip-${STATUS_CLASS[c.status]}">${STATUS_ICON[c.status]}</span>
              <span class="kb-title">${c.status}</span>
              <span class="g-count">${c.items.length}</span>
            </div>
            <div class="kb-col-body">
              ${c.items.map(kanbanCard).join("") || `<div class="empty-state" style="padding:10px">Nothing here.</div>`}
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function kanbanCard(t) {
    const proj = projectById(t.projectId);
    const venue = venueById(t.venueId || (proj && proj.venueId));
    const meta = [proj ? proj.name : null, venue ? venue.name : null, t.ownerName || null].filter(Boolean).join(" · ");
    return `<div class="kb-card ${isOverdue(t) ? "overdue" : ""}" draggable="true" data-kb-card="${t.id}" data-open-task="${t.id}">
      <div class="kb-name">${escapeHtml(t.name)}</div>
      <div class="kb-meta">${escapeHtml(meta || "Unassigned")}${t.dueDate ? " · due " + fmtShort(t.dueDate) : ""}</div>
    </div>`;
  }

  function bindKanbanEvents(root) {
    root.querySelectorAll("[data-kb-filter]").forEach(sel => sel.addEventListener("change", () => {
      state.ui.kanbanFilter = Object.assign({}, state.ui.kanbanFilter, { [sel.dataset.kbFilter]: sel.value || null });
      save(); renderPage();
    }));
    const clear = root.querySelector("[data-kb-clear]");
    if (clear) clear.addEventListener("click", () => { state.ui.kanbanFilter = {}; save(); renderPage(); });

    let draggingId = null;
    root.querySelectorAll("[data-kb-card]").forEach(card => {
      card.addEventListener("dragstart", (e) => {
        draggingId = card.dataset.kbCard;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", draggingId);
      });
      card.addEventListener("dragend", () => { draggingId = null; card.classList.remove("dragging"); });
    });
    root.querySelectorAll("[data-kb-col]").forEach(col => {
      col.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; col.classList.add("drag-over"); });
      col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
      col.addEventListener("drop", (e) => {
        e.preventDefault(); col.classList.remove("drag-over");
        const id = draggingId || e.dataTransfer.getData("text/plain");
        const t = taskById(id);
        if (!t) return;
        const newStatus = col.dataset.kbCol;
        if (t.status === newStatus) return;
        t.status = newStatus;
        if (newStatus === "Done") t.progressPct = 100;
        save(); toast("Moved to " + newStatus); renderPage();
      });
    });

  async function exportBackup() {
    const payload = JSON.stringify(state, null, 2);
    const filename = "metropolitan-estates-backup-" + todayISO() + ".json";
    if (window.claude && window.claude.downloads) {
      try { await window.claude.downloads.save({ filename, data: payload }); toast("Backup saved"); }
      catch (err) { if (err && err.code === "declined") return; toast("Couldn't save the file (" + (err && err.code || "unknown") + ")"); }
    } else {
      const blob = new Blob([payload], { type: "application/json" }); const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
      toast("Backup saved");
    }
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.tasks)) throw new Error("Not a recognised backup file");
        // Merge into existing data (never silently replace it) — venues stay as seeded,
        // ids that collide with something already here get a fresh id, with references updated to match.
        const idMap = {};
        const remap = (id) => (id == null ? id : (idMap[id] || id));
        const existingProjectIds = new Set(state.projects.map(p => p.id));
        const existingTaskIds = new Set(state.tasks.map(t => t.id));
        const existingBudgetIds = new Set(state.budgetLines.map(b => b.id));

        const newProjects = (parsed.projects || []).map(p => {
          const id = existingProjectIds.has(p.id) ? uid() : p.id;
          if (id !== p.id) idMap[p.id] = id;
          return { ...p, id };
        });
        const newTasks = (parsed.tasks || []).map(t => {
          const id = existingTaskIds.has(t.id) ? uid() : t.id;
          if (id !== t.id) idMap[t.id] = id;
          return { ...t, id };
        });
        newTasks.forEach(t => { t.projectId = remap(t.projectId); t.dependsOnTaskId = remap(t.dependsOnTaskId); });
        const newBudgetLines = (parsed.budgetLines || []).map(b => {
          const id = existingBudgetIds.has(b.id) ? uid() : b.id;
          return { ...b, id, projectId: remap(b.projectId) };
        });

        state.projects.push(...newProjects);
        state.tasks.push(...newTasks);
        state.budgetLines.push(...newBudgetLines);

        PROJECT_LOG_ENTITIES.forEach(cfg => {
          const existingIds = new Set(state[cfg.key].map(r => r.id));
          const incoming = (parsed[cfg.key] || []).map(r => {
            const id = existingIds.has(r.id) ? uid() : r.id;
            return { ...r, id, projectId: remap(r.projectId) };
          });
          state[cfg.key].push(...incoming);
        });

        save(); toast(`Imported ${newProjects.length} project(s), ${newTasks.length} task(s) — added to what's already here`); renderPage();
      } catch (e) { toast("Import failed — that file doesn't look like a backup"); }
    };
    reader.readAsText(file);
  }

    root.querySelectorAll("[data-open-task]").forEach(el => el.addEventListener("click", (e) => { if (e.target.closest("[data-open-task]") !== el) return; openTaskModal(el.dataset.openTask); }));
    root.querySelectorAll("[data-open-project]").forEach(el => el.addEventListener("click", (e) => { if (e.target.closest("button")) return; viewProject(el.dataset.openProject); }));
    const newProjectBtn = root.querySelector('[data-action="new-project"]'); if (newProjectBtn) newProjectBtn.addEventListener("click", () => openProjectModal(null));
    if (activePage === "project-detail") bindProjectDetailEvents(root);
    const logCostBtn = root.querySelector('[data-action="log-cost"]'); if (logCostBtn) logCostBtn.addEventListener("click", () => openCostModal());
    const exportBtn = root.querySelector('[data-action="export"]'); if (exportBtn) exportBtn.addEventListener("click", exportBackup);
    const importInput = root.querySelector("#importFile"); if (importInput) importInput.addEventListener("change", () => { if (importInput.files[0]) importBackup(importInput.files[0]); });
    const resetBtn = root.querySelector('[data-action="reset-all"]'); if (resetBtn) resetBtn.addEventListener("click", () => {
      if (confirm("Erase all projects, tasks and budget data in this browser? This can't be undone unless you have a backup file.")) { state = freshState(); save(); toast("All data erased"); renderPage(); }
    });
    root.querySelectorAll("[data-gov-day]").forEach(inp => inp.addEventListener("change", () => {
      const v = Math.min(Math.max(parseInt(inp.value, 10) || 1, 1), 28);
      state.ui.govDays = Object.assign({}, govDays(), { [inp.dataset.govDay]: v });
      save();
      // renderPage() replaces #content wholesale. Doing that synchronously inside a
      // change handler tears the focused input out mid-blur and Chrome throws on the
      // innerHTML assignment — blur first, then re-render on the next tick.
      inp.blur();
      setTimeout(renderPage, 0);
    }));
    const govToggle = root.querySelector("[data-gov-toggle]");
    if (govToggle) govToggle.addEventListener("click", () => { state.ui.hideGovernance = !state.ui.hideGovernance; save(); renderPage(); });
    root.querySelectorAll("[data-cal-nav]").forEach(el => el.addEventListener("click", () => {
      const [y, m] = state.ui.calMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(el.dataset.calNav), 1);
      state.ui.calMonth = d.getFullYear() + "-" + pad2(d.getMonth() + 1); save(); renderPage();
    }));
    if (activePage === "gantt") bindGanttEvents(root);
    if (activePage === "kanban") bindKanbanEvents(root);
  }

  /* ---------- Paste-an-email import (heuristic, no external calls) -----------
     Guesses a title/due date/sender/project from pasted email or Copilot-summary
     text, then opens the ordinary task modal pre-filled — nothing is ever saved
     until the person reviews it there and hits Save. There's no AI or network
     call here (this file makes none, by design); it's regex/keyword heuristics
     only, so it's meant to save typing on the obvious cases, not be always right. */
  const MONTH_NAMES = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
  const WEEKDAY_NAMES = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];

  function guessDateFromText(text) {
    const lower = text.toLowerCase();
    const today = parseISO(todayISO());

    if (/\btoday\b/.test(lower)) return todayISO();
    if (/\btomorrow\b/.test(lower)) return addDays(todayISO(), 1);

    const nextWeekday = lower.match(/\bnext\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
    if (nextWeekday) {
      const targetDow = WEEKDAY_NAMES.indexOf(nextWeekday[1]);
      const delta = ((targetDow - today.getDay() + 7) % 7) || 7;
      return addDays(todayISO(), delta);
    }
    const byWeekday = lower.match(/\bby\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
    if (byWeekday) {
      const targetDow = WEEKDAY_NAMES.indexOf(byWeekday[1]);
      const delta = ((targetDow - today.getDay() + 7) % 7) || 7;
      return addDays(todayISO(), delta);
    }

    const iso = text.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);
    if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;

    // UK-style DD/MM(/YYYY) — assume UK date order, not US, for this user base.
    const ukNumeric = text.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/);
    if (ukNumeric) {
      const day = +ukNumeric[1], month = +ukNumeric[2];
      if (day <= 31 && month <= 12) {
        let year = ukNumeric[3] ? +ukNumeric[3] : today.getFullYear();
        if (year < 100) year += 2000;
        const candidate = new Date(year, month - 1, day);
        if (!ukNumeric[3] && candidate < today) candidate.setFullYear(year + 1);
        return toISO(candidate);
      }
    }

    const dayThenMonth = lower.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(january|february|march|april|may|june|july|august|september|october|november|december)(?:\s+(\d{4}))?\b/);
    if (dayThenMonth) {
      const day = +dayThenMonth[1], month = MONTH_NAMES.indexOf(dayThenMonth[2]);
      let year = dayThenMonth[3] ? +dayThenMonth[3] : today.getFullYear();
      const candidate = new Date(year, month, day);
      if (!dayThenMonth[3] && candidate < today) candidate.setFullYear(year + 1);
      return toISO(candidate);
    }
    const monthThenDay = lower.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?\b/);
    if (monthThenDay) {
      const month = MONTH_NAMES.indexOf(monthThenDay[1]), day = +monthThenDay[2];
      let year = monthThenDay[3] ? +monthThenDay[3] : today.getFullYear();
      const candidate = new Date(year, month, day);
      if (!monthThenDay[3] && candidate < today) candidate.setFullYear(year + 1);
      return toISO(candidate);
    }
    return "";
  }

  function parseEmailText(text) {
    const lines = text.split("\n").map(l => l.trim());
    const nonEmpty = lines.filter(Boolean);
    const subjectLine = lines.find(l => /^subject:/i.test(l));
    const fromLine = lines.find(l => /^from:/i.test(l));

    let name = "";
    if (subjectLine) name = subjectLine.replace(/^subject:\s*/i, "").replace(/^(re|fwd?):\s*/i, "").trim();
    else if (nonEmpty[0]) name = nonEmpty[0].slice(0, 90);

    let ownerName = "", ownerEmail = "";
    if (fromLine) {
      const m = fromLine.match(/^from:\s*([^<]*?)(?:<([^>]+)>)?\s*$/i);
      if (m) { ownerName = (m[1] || "").trim().replace(/["<>]/g, ""); ownerEmail = (m[2] || "").trim(); }
    }
    if (!ownerEmail) {
      const emailMatch = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
      if (emailMatch) ownerEmail = emailMatch[0];
    }

    const matchingProject = state.projects.find(p => p.name && text.toLowerCase().includes(p.name.toLowerCase()));

    return {
      name: name || "Untitled — from pasted email",
      ownerName, ownerEmail,
      dueDate: guessDateFromText(text),
      projectId: matchingProject ? matchingProject.id : null,
      notes: text.trim(),
    };
  }
