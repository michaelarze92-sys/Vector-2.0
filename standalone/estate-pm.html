  function renderTaskModal(dlg, draft, isEdit) {
    const projectOptions = state.projects.map(p => `<option value="${p.id}" ${draft.projectId === p.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("");
    const otherTasks = state.tasks.filter(t => t.id !== draft.id);
    const depOptions = `<option value="">None</option>` + otherTasks.map(t => `<option value="${t.id}" ${draft.dependsOnTaskId === t.id ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("");

    dlg.innerHTML = `
      <div class="modal-head"><h3>${isEdit ? "Edit task" : "New task"}</h3><button class="icon-x" data-close>${ICON.x}</button></div>
      <div class="modal-body">
        <div class="field"><label>Task name</label><input type="text" id="mName" value="${escapeHtml(draft.name)}" required /></div>
        <div class="field-row">
          <div class="field"><label>Project</label><select id="mProject"><option value="">No project</option>${projectOptions}</select></div>
          <div class="field"><label>Depends on</label><select id="mDep">${depOptions}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Start date</label><input type="date" id="mStart" value="${draft.startDate || ""}" /></div>
          <div class="field"><label>Due date</label><input type="date" id="mDue" value="${draft.dueDate || ""}" /></div>
        </div>
        <div class="field"><label>Status</label><div class="status-pick" id="mStatus">${STATUSES.map(s => `<button type="button" data-v="${s}" class="${draft.status === s ? "active" : ""}">${s}</button>`).join("")}</div></div>
        <div class="field"><label>Priority</label><div class="priority-pick" id="mPriority">${PRIORITIES.map(s => `<button type="button" data-v="${s}" class="${draft.priority === s ? "active" : ""}">${s}</button>`).join("")}</div></div>
        <div class="field-row">
          <div class="field"><label>Delegate to (name)</label><input type="text" id="mOwnerName" value="${escapeHtml(draft.ownerName)}" /></div>
          <div class="field"><label>Delegate email</label><input type="text" id="mOwnerEmail" value="${escapeHtml(draft.ownerEmail)}" /></div>
        </div>
        <div class="toggle-row"><span>Requires Board input<div class="hint">Flags this task in reporting</div></span><label class="switch"><input type="checkbox" id="mBoard" ${draft.boardInputRequired ? "checked" : ""} /><span class="track"></span></label></div>
        <div class="field"><label>Checklist</label><div id="mChecklist"></div>
          <div class="checklist-add"><input type="text" id="mNewCheck" placeholder="Add a subtask…" /><button class="btn btn-sm" id="mAddCheck" type="button">${ICON.plus}</button></div>
        </div>
        <div class="field"><label>Notes</label><textarea id="mNotes">${escapeHtml(draft.notes)}</textarea></div>
      </div>
      <div class="modal-foot">
        <div>${isEdit ? `<button class="btn btn-ghost modal-danger" id="mDelete">${ICON.trash} Delete</button>` : "<span></span>"}</div>
        <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn btn-accent" id="mSave">Save</button></div>
      </div>
    `;

    const openDetails = new Set();
    function renderChecklist() {
      const el = dlg.querySelector("#mChecklist");
      el.innerHTML = draft.checklist.map((c, i) => {
        const hasDetails = !!((c.notes && c.notes.trim()) || c.dueDate || (c.assigneeName && c.assigneeName.trim()));
        const isOpen = openDetails.has(c.id);
        const metaBits = [];
        if (c.dueDate) metaBits.push(`<span class="checklist-meta-item">${ICON.calendar}${fmtShort(c.dueDate)}</span>`);
        if (c.assigneeName && c.assigneeName.trim()) metaBits.push(`<span class="checklist-meta-item">${ICON.contact}${escapeHtml(c.assigneeName)}</span>`);
        return `
        <div class="checklist-item">
          <input type="checkbox" data-ci="${i}" ${c.done ? "checked" : ""} />
          <input type="text" data-cl="${i}" value="${escapeHtml(c.label)}" placeholder="Subtask" />
          <button type="button" class="icon-x ${hasDetails ? "has-note" : ""}" data-cn="${c.id}" title="${isOpen ? "Hide details" : "Due date, delegate, notes"}">${ICON.note}</button>
          <button type="button" class="icon-x" data-cx="${i}">${ICON.x}</button>
        </div>
        ${metaBits.length && !isOpen ? `<div class="checklist-meta">${metaBits.join(" &nbsp;·&nbsp; ")}</div>` : ""}
        ${isOpen ? `
        <div class="checklist-details">
          <div class="field-row">
            <div class="field"><label>Due date</label><input type="date" data-cd="${i}" value="${c.dueDate || ""}" /></div>
            <div class="field"><label>Delegate to</label><input type="text" data-can="${i}" value="${escapeHtml(c.assigneeName || "")}" placeholder="Name" /></div>
          </div>
          <div class="field"><label>Delegate email</label><input type="text" data-cae="${i}" value="${escapeHtml(c.assigneeEmail || "")}" placeholder="Email" /></div>
          <div class="field"><label>Notes</label><textarea class="checklist-note" data-cnt="${i}" placeholder="Details for this subtask — e.g. from a call or transcript">${escapeHtml(c.notes || "")}</textarea></div>
        </div>` : ""}`;
      }).join("") || `<div style="font-size:12px;color:var(--ink-muted);padding:4px 0">No subtasks yet.</div>`;
      el.querySelectorAll("[data-ci]").forEach(c => c.addEventListener("change", () => { draft.checklist[+c.dataset.ci].done = c.checked; }));
      el.querySelectorAll("[data-cl]").forEach(c => c.addEventListener("input", () => { draft.checklist[+c.dataset.cl].label = c.value; }));
      el.querySelectorAll("[data-cx]").forEach(c => c.addEventListener("click", () => { draft.checklist.splice(+c.dataset.cx, 1); renderChecklist(); }));
      el.querySelectorAll("[data-cn]").forEach(c => c.addEventListener("click", () => {
        const id = c.dataset.cn;
        if (openDetails.has(id)) openDetails.delete(id); else openDetails.add(id);
        renderChecklist();
      }));
      el.querySelectorAll("[data-cnt]").forEach(t => t.addEventListener("input", () => { draft.checklist[+t.dataset.cnt].notes = t.value; }));
      el.querySelectorAll("[data-cd]").forEach(t => t.addEventListener("input", () => { draft.checklist[+t.dataset.cd].dueDate = t.value || null; }));
      el.querySelectorAll("[data-can]").forEach(t => t.addEventListener("input", () => { draft.checklist[+t.dataset.can].assigneeName = t.value; }));
      el.querySelectorAll("[data-cae]").forEach(t => t.addEventListener("input", () => { draft.checklist[+t.dataset.cae].assigneeEmail = t.value; }));
    }
    renderChecklist();

    dlg.querySelector("#mAddCheck").addEventListener("click", () => {
      const inp = dlg.querySelector("#mNewCheck"); const label = inp.value.trim(); if (!label) return;
      draft.checklist.push({ id: uid(), label, done: false, notes: "", dueDate: null, assigneeName: "", assigneeEmail: "" }); inp.value = ""; renderChecklist();
    });
    dlg.querySelector("#mStatus").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.status = b.dataset.v; dlg.querySelectorAll("#mStatus button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelector("#mPriority").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.priority = b.dataset.v; dlg.querySelectorAll("#mPriority button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));

    const deleteBtn = dlg.querySelector("#mDelete");
    if (deleteBtn) deleteBtn.addEventListener("click", () => {
      if (confirm("Delete this task?")) { state.tasks = state.tasks.filter(t => t.id !== draft.id); save(); dlg.close(); toast("Task deleted"); renderPage(); }
    });

    dlg.querySelector("#mSave").addEventListener("click", () => {
      const name = dlg.querySelector("#mName").value.trim(); if (!name) { dlg.querySelector("#mName").focus(); return; }
      const projectId = dlg.querySelector("#mProject").value || null;
      const proj = projectId ? projectById(projectId) : null;
      const wasStatus = draft.id ? (taskById(draft.id) || {}).status : null;
      const payload = {
        id: draft.id || uid(), projectId, venueId: proj ? proj.venueId : draft.venueId,
        name, ownerName: dlg.querySelector("#mOwnerName").value.trim(), ownerEmail: dlg.querySelector("#mOwnerEmail").value.trim(),
        startDate: dlg.querySelector("#mStart").value || null, dueDate: dlg.querySelector("#mDue").value || null,
        status: draft.status, priority: draft.priority, dependsOnTaskId: dlg.querySelector("#mDep").value || null,
        boardInputRequired: dlg.querySelector("#mBoard").checked, notes: dlg.querySelector("#mNotes").value,
        checklist: draft.checklist, createdAt: draft.createdAt || Date.now(),
      };
      const checklistTotal = payload.checklist.length;
      const checklistDone = payload.checklist.filter(c => c.done).length;
      payload.progressPct = payload.status === "Done" ? 100 : payload.status === "Not Started" ? 0 : checklistTotal ? Math.round((checklistDone / checklistTotal) * 100) : (draft.progressPct || 0);
      const idx = state.tasks.findIndex(t => t.id === payload.id);
      if (idx >= 0) state.tasks[idx] = payload; else state.tasks.push(payload);
      save(); dlg.close(); toast(isEdit ? "Task updated" : "Task added");
      renderPage();
      if (payload.status === "Done" && wasStatus !== "Done") {
        requestAnimationFrame(() => { const barEl = document.querySelector(`[data-task-id="${payload.id}"]`); const bar = barEl && barEl.closest(".g-bar"); if (bar) bar.classList.add("just-completed"); });
      }
    });
  }

  /* ============================== PROJECT MODAL ============================== */
  function openProjectModal(id) {
    const dlg = document.getElementById("projectDialog");
    const existing = id ? projectById(id) : null;
    const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
      id: null, name: "", venueId: state.venues[0] ? state.venues[0].id : null, category: "Other", owner: "",
      status: "Not Started", stageGate: STAGE_GATES[0], budgetAllocated: 0, startDate: todayISO(), targetEndDate: "", actualEndDate: "",
      licenceRiskFlag: false, gamingFloorDisruption: false,
    };
    if (!draft.stageGate) draft.stageGate = STAGE_GATES[0];

    dlg.innerHTML = `
      <div class="modal-head"><h3>${existing ? "Edit project" : "New project"}</h3><button class="icon-x" data-close>${ICON.x}</button></div>
      <div class="modal-body">
        <div class="field"><label>Project name</label><input type="text" id="pName" value="${escapeHtml(draft.name)}" required /></div>
        <div class="field-row">
          <div class="field"><label>Venue</label><select id="pVenue">${state.venues.map(v => `<option value="${v.id}" ${draft.venueId === v.id ? "selected" : ""}>${escapeHtml(v.name)}</option>`).join("")}</select></div>
          <div class="field"><label>Category</label><select id="pCategory">${CATEGORIES.map(c => `<option value="${c}" ${draft.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label>Owner</label><input type="text" id="pOwner" value="${escapeHtml(draft.owner)}" placeholder="e.g. Venue Director, Dalkia" /></div>
        <div class="field"><label>Status</label><div class="status-pick" id="pStatus">${STATUSES.map(s => `<button type="button" data-v="${s}" class="${draft.status === s ? "active" : ""}">${s}</button>`).join("")}</div></div>
        <div class="field"><label>Stage gate<div class="hint">Governance checkpoint — log who approved the move in this project's Decisions Log</div></label><div class="status-pick" id="pStageGate">${STAGE_GATES.map(g => `<button type="button" data-v="${g}" class="${draft.stageGate === g ? "active" : ""}">${g}</button>`).join("")}</div></div>
        <div class="field-row">
          <div class="field"><label>Start date</label><input type="date" id="pStart" value="${draft.startDate || ""}" /></div>
          <div class="field"><label>Target end date</label><input type="date" id="pEnd" value="${draft.targetEndDate || ""}" /></div>
        </div>
        <div class="field"><label>Budget allocated (£)</label><input type="number" id="pBudget" value="${draft.budgetAllocated || 0}" min="0" step="100" /></div>
        <div class="toggle-row"><span>Licence risk<div class="hint">Delay here threatens a statutory/licensing deadline</div></span><label class="switch"><input type="checkbox" id="pLicence" ${draft.licenceRiskFlag ? "checked" : ""} /><span class="track"></span></label></div>
        <div class="toggle-row"><span>Gaming floor disruption<div class="hint">This project affects gaming floor availability</div></span><label class="switch"><input type="checkbox" id="pDisrupt" ${draft.gamingFloorDisruption ? "checked" : ""} /><span class="track"></span></label></div>
      </div>
      <div class="modal-foot">
        <div>${existing ? `<button class="btn btn-ghost modal-danger" id="pDelete">${ICON.trash} Delete</button>` : "<span></span>"}</div>
        <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn btn-accent" id="pSave">Save</button></div>
      </div>
    `;
    dlg.querySelector("#pStatus").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.status = b.dataset.v; dlg.querySelectorAll("#pStatus button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelector("#pStageGate").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; draft.stageGate = b.dataset.v; dlg.querySelectorAll("#pStageGate button").forEach(x => x.classList.toggle("active", x === b)); });
    dlg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));
    const deleteBtn = dlg.querySelector("#pDelete");
    if (deleteBtn) deleteBtn.addEventListener("click", () => {
      if (confirm("Delete this project? Its tasks will become standalone (unassigned).")) {
        state.tasks.forEach(t => { if (t.projectId === draft.id) { t.projectId = null; t.venueId = draft.venueId; } });
        state.projects = state.projects.filter(p => p.id !== draft.id);
        save(); dlg.close(); toast("Project deleted"); renderPage();
      }
    });
    dlg.querySelector("#pSave").addEventListener("click", () => {
      const name = dlg.querySelector("#pName").value.trim(); if (!name) { dlg.querySelector("#pName").focus(); return; }
      const payload = {
        id: draft.id || uid(), name, venueId: dlg.querySelector("#pVenue").value, category: dlg.querySelector("#pCategory").value,
        owner: dlg.querySelector("#pOwner").value.trim(), status: draft.status, stageGate: draft.stageGate || STAGE_GATES[0], budgetAllocated: Number(dlg.querySelector("#pBudget").value) || 0,
        startDate: dlg.querySelector("#pStart").value || null, targetEndDate: dlg.querySelector("#pEnd").value || null, actualEndDate: draft.actualEndDate || null,
        licenceRiskFlag: dlg.querySelector("#pLicence").checked, gamingFloorDisruption: dlg.querySelector("#pDisrupt").checked,
      };
      const idx = state.projects.findIndex(p => p.id === payload.id);
      if (idx >= 0) state.projects[idx] = payload; else state.projects.push(payload);
      save(); dlg.close(); toast(existing ? "Project updated" : "Project added"); renderPage();
    });
    dlg.showModal();
  }

  /* ============================== COST MODAL ============================== */
  function openCostModal() {
    const dlg = document.getElementById("costDialog");
    if (!state.projects.length) { toast("Add a project first"); return; }
    dlg.innerHTML = `
      <div class="modal-head"><h3>Log a cost</h3><button class="icon-x" data-close>${ICON.x}</button></div>
      <div class="modal-body">
        <div class="field"><label>Project</label><select id="cProject">${state.projects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select></div>
        <div class="field"><label>Description</label><input type="text" id="cDesc" required /></div>
        <div class="field-row">
          <div class="field"><label>Supplier</label><input type="text" id="cSupplier" placeholder="e.g. Dalkia" /></div>
          <div class="field"><label>Amount (£)</label><input type="number" id="cAmount" min="0" step="1" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="cDate" value="${todayISO()}" /></div>
          <div class="field"><label>Category</label><input type="text" id="cCategory" placeholder="e.g. M&E, PPM, Reactive" /></div>
        </div>
      </div>
      <div class="modal-foot"><span></span><div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn btn-accent" id="cSave">Save</button></div></div>
    `;
    dlg.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));
    dlg.querySelector("#cSave").addEventListener("click", () => {
      const description = dlg.querySelector("#cDesc").value.trim(); if (!description) { dlg.querySelector("#cDesc").focus(); return; }
      state.budgetLines.push({
        id: uid(), projectId: dlg.querySelector("#cProject").value, description,
        supplier: dlg.querySelector("#cSupplier").value.trim(), amount: Number(dlg.querySelector("#cAmount").value) || 0,
        dateLogged: dlg.querySelector("#cDate").value || todayISO(), category: dlg.querySelector("#cCategory").value.trim(),
      });
      save(); dlg.close(); toast("Cost logged"); renderPage();
    });
    dlg.showModal();
  }

  /* ============================== INIT ============================== */
  renderNav();
  renderPage();

  // Installs a service worker for offline support + "Add to Home Screen".
  // Silently does nothing where there's no sibling sw.js to find (e.g. the
  // Claude Artifact link) — that's expected, not an error.
  // registration is null for a content-only update (estate-pm.html changed but sw.js
  // didn't) — there's no waiting worker to activate, so the reload alone picks up the
  // freshly revalidated cache entry.
  function showUpdateToast(registration) {
    const el = document.getElementById("updateToast");
    el.style.display = "flex";
    document.getElementById("updateReloadBtn").onclick = () => {
      if (registration && registration.waiting) registration.waiting.postMessage({ type: "SKIP_WAITING" });
      else window.location.reload();
    };
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        if (reg.waiting) showUpdateToast(reg);
        reg.addEventListener('updatefound', () => {
          const installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', () => {
            // "installed" + an existing controller means this is an *update*, not the
            // first-ever install — first install has nothing running yet to interrupt.
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateToast(reg);
            }
          });
        });
      }).catch(() => {});
      // Deliberately not automatic: reload only once the user taps the toast, so a
      // half-typed issue on the gaming floor never gets swept away by a background update.
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'CONTENT_UPDATED') showUpdateToast(null);
      });
      // Ask whether the worker already spotted new content — the revalidation that
      // finds it runs during navigation, so by the time this page can listen, the
      // moment has passed. The worker keeps a flag; this is the page collecting it.
      navigator.serviceWorker.ready.then((reg) => {
        const worker = navigator.serviceWorker.controller || reg.active;
        if (worker) worker.postMessage({ type: 'CHECK_CONTENT_UPDATE' });
      });
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  }
})();
</script>
