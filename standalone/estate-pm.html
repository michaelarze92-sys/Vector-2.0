<title>Metropolitan Estates — Project & Compliance Board</title>
<style>
  /* ---------- Design tokens ---------- */
  :root {
    color-scheme: light;
    --page: #f2f4ef;
    --surface: #ffffff;
    --surface-2: #f7f8f4;
    --border: rgba(15, 30, 22, 0.11);
    --border-strong: rgba(15, 30, 22, 0.20);
    --ink: #10201a;
    --ink-secondary: #4c5b53;
    --ink-muted: #7c8a82;
    --accent: #8a6416;
    --accent-ink: #ffffff;
    --accent-soft: #f1e6cf;
    --accent-soft-ink: #6b4c10;
    --felt: #123526;
    --felt-2: #0e2a1e;
    --felt-ink: #eef2ea;
    --felt-ink-muted: #a9bdb2;
    --shadow: 0 1px 2px rgba(16, 32, 26, 0.06), 0 8px 24px -12px rgba(16, 32, 26, 0.18);

    --st-notstarted: #5b6b63;
    --st-inprogress: #2a78d6;
    --st-blocked: #d03b3b;
    --st-done: #0ca30c;
    --st-notstarted-soft: rgba(91, 107, 99, 0.12);
    --st-inprogress-soft: rgba(42, 120, 214, 0.12);
    --st-blocked-soft: rgba(208, 59, 59, 0.12);
    --st-done-soft: rgba(12, 163, 12, 0.12);

    --pr-low: #7c8a82;
    --pr-medium: #2a78d6;
    --pr-high: #c9840b;
    --pr-critical: #d03b3b;

    --radius: 10px;
    --radius-sm: 6px;
    font-size: 15px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0b0f0c;
      --surface: #13221b;
      --surface-2: #17281f;
      --border: rgba(238, 242, 234, 0.10);
      --border-strong: rgba(238, 242, 234, 0.20);
      --ink: #f2f1ea;
      --ink-secondary: #c3cbc4;
      --ink-muted: #8fa198;
      --accent: #d9ac59;
      --accent-ink: #1a1305;
      --accent-soft: rgba(217, 172, 89, 0.16);
      --accent-soft-ink: #e8c583;
      --felt: #0e2119;
      --felt-2: #12291f;
      --felt-ink: #eef2ea;
      --felt-ink-muted: #8fa198;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -12px rgba(0, 0, 0, 0.55);

      --st-notstarted: #8a9c93;
      --st-inprogress: #3987e5;
      --st-blocked: #e66767;
      --st-done: #3fc23f;
      --st-notstarted-soft: rgba(138, 156, 147, 0.16);
      --st-inprogress-soft: rgba(57, 135, 229, 0.16);
      --st-blocked-soft: rgba(230, 103, 103, 0.16);
      --st-done-soft: rgba(63, 194, 63, 0.16);

      --pr-low: #8fa198;
      --pr-medium: #3987e5;
      --pr-high: #e0a53a;
      --pr-critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0b0f0c;
    --surface: #13221b;
    --surface-2: #17281f;
    --border: rgba(238, 242, 234, 0.10);
    --border-strong: rgba(238, 242, 234, 0.20);
    --ink: #f2f1ea;
    --ink-secondary: #c3cbc4;
    --ink-muted: #8fa198;
    --accent: #d9ac59;
    --accent-ink: #1a1305;
    --accent-soft: rgba(217, 172, 89, 0.16);
    --accent-soft-ink: #e8c583;
    --felt: #0e2119;
    --felt-2: #12291f;
    --felt-ink: #eef2ea;
    --felt-ink-muted: #8fa198;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 28px -12px rgba(0, 0, 0, 0.55);

    --st-notstarted: #8a9c93;
    --st-inprogress: #3987e5;
    --st-blocked: #e66767;
    --st-done: #3fc23f;
    --st-notstarted-soft: rgba(138, 156, 147, 0.16);
    --st-inprogress-soft: rgba(57, 135, 229, 0.16);
    --st-blocked-soft: rgba(230, 103, 103, 0.16);
    --st-done-soft: rgba(63, 194, 63, 0.16);

    --pr-low: #8fa198;
    --pr-medium: #3987e5;
    --pr-high: #e0a53a;
    --pr-critical: #e66767;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f2f4ef; --surface: #ffffff; --surface-2: #f7f8f4;
    --border: rgba(15,30,22,0.11); --border-strong: rgba(15,30,22,0.20);
    --ink: #10201a; --ink-secondary: #4c5b53; --ink-muted: #7c8a82;
    --accent: #8a6416; --accent-ink: #ffffff; --accent-soft: #f1e6cf; --accent-soft-ink: #6b4c10;
    --felt: #123526; --felt-2: #0e2a1e; --felt-ink: #eef2ea; --felt-ink-muted: #a9bdb2;
    --st-notstarted: #5b6b63; --st-inprogress: #2a78d6; --st-blocked: #d03b3b; --st-done: #0ca30c;
    --st-notstarted-soft: rgba(91,107,99,0.12); --st-inprogress-soft: rgba(42,120,214,0.12);
    --st-blocked-soft: rgba(208,59,59,0.12); --st-done-soft: rgba(12,163,12,0.12);
    --pr-low: #7c8a82; --pr-medium: #2a78d6; --pr-high: #c9840b; --pr-critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--accent-soft); color: var(--accent-soft-ink); }
  button { font-family: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Shell layout ---------- */
  .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  .nav {
    width: 216px; flex: none; background: var(--felt); color: var(--felt-ink);
    display: flex; flex-direction: column; padding: 18px 12px;
    border-right: 1px solid rgba(0,0,0,0.25);
  }
  .nav-backdrop { display: none; }
  .hamburger { display: none; flex: none; padding: 8px; }
  .hamburger svg { display: block; }
  @media (max-width: 780px) {
    .hamburger { display: inline-flex; }
    .nav {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    .nav.open { transform: translateX(0); }
    .nav-backdrop.show {
      display: block; position: fixed; inset: 0; background: rgba(6, 10, 8, 0.45); z-index: 40;
    }
    .topbar { flex-wrap: wrap; }
    .quickadd { flex-wrap: wrap; }
    .quickadd input[type="text"] { flex: 1 1 100%; }
    .stat-row { grid-template-columns: repeat(2, 1fr) !important; }
    .field-row { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 460px) {
    .stat-row { grid-template-columns: 1fr !important; }
  }
  .nav-brand { padding: 6px 10px 18px; }
  .nav-brand .name { font-size: 14.5px; font-weight: 700; letter-spacing: 0.2px; }
  .nav-brand .sub { font-size: 11.5px; color: var(--felt-ink-muted); margin-top: 2px; }
  .nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--felt-ink-muted); cursor: pointer; font-size: 13.5px; font-weight: 500; border: none; background: none;
    width: 100%; text-align: left;
  }
  .nav-item svg { flex: none; opacity: 0.85; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--felt-ink); }
  .nav-item.active { background: rgba(255,255,255,0.12); color: var(--felt-ink); }
  .nav-item.active svg { opacity: 1; }
  .nav-spacer { flex: 1; }
  .nav-foot { padding: 10px; font-size: 11px; color: var(--felt-ink-muted); line-height: 1.5; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .quickadd { flex: 1; display: flex; align-items: center; gap: 8px; }
  .quickadd input[type="text"] {
    flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
    border-radius: var(--radius-sm); padding: 9px 12px; font-size: 14px;
  }
  .quickadd input[type="text"]:focus { border-color: var(--accent); background: var(--surface); }
  .quickadd select, .quickadd input[type="date"] {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-secondary);
    border-radius: var(--radius-sm); padding: 8px 8px; font-size: 13px; max-width: 132px;
  }
  .btn {
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { filter: brightness(1.06); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .content { flex: 1; overflow-y: auto; padding: 22px 26px 60px; }
  .page { display: none; max-width: 1320px; margin: 0 auto; }
  .page.active { display: block; }

  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .page-head h1 { font-size: 20px; margin: 0; letter-spacing: -0.2px; text-wrap: balance; }
  .page-head .desc { font-size: 13px; color: var(--ink-muted); margin-top: 3px; }
  .page-actions { display: flex; gap: 8px; align-items: center; }

  /* ---------- Stat tiles ---------- */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 900px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
  }
  .stat-tile .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-muted); font-weight: 600; }
  .stat-tile .value { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .stat-tile .value.accent-good { color: var(--st-done); }
  .stat-tile .value.accent-warn { color: var(--pr-high); }
  .stat-tile .value.accent-bad { color: var(--st-blocked); }
  .stat-tile .sub { font-size: 12px; color: var(--ink-muted); }

  /* ---------- Cards / sections ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .card + .card { margin-top: 16px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .card-head h2 { font-size: 14.5px; margin: 0; font-weight: 700; }
  .card-body { padding: 6px 8px; }
  .card-body.pad { padding: 14px 16px; }

  .empty-state { padding: 34px 20px; text-align: center; color: var(--ink-muted); font-size: 13.5px; }
  .empty-state .btn { margin-top: 10px; }

  /* ---------- Task row (list contexts: dashboard, calendar day) ---------- */
  .task-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 10px; border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .task-row:hover { background: var(--surface-2); }
  .task-row .status-dot { flex: none; }
  .task-row .t-main { flex: 1; min-width: 0; }
  .task-row .t-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-row .t-meta { font-size: 11.5px; color: var(--ink-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-row .t-due { flex: none; font-size: 12px; font-weight: 600; text-align: right; min-width: 78px; }
  .task-row.overdue-row { border-left: 3px solid var(--st-blocked); background: var(--st-blocked-soft); }
  .task-row.overdue-row:hover { filter: brightness(0.98); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700; white-space: nowrap;
  }
  .chip svg { flex: none; }
  .chip-notstarted { background: var(--st-notstarted-soft); color: var(--st-notstarted); }
  .chip-inprogress { background: var(--st-inprogress-soft); color: var(--st-inprogress); }
  .chip-blocked { background: var(--st-blocked-soft); color: var(--st-blocked); }
  .chip-done { background: var(--st-done-soft); color: var(--st-done); }

  .pr-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; }
  .pr-flag.pr-Critical { color: var(--pr-critical); }
  .pr-flag.pr-High { color: var(--pr-high); }
  .pr-flag.pr-Medium { color: var(--pr-medium); }
  .pr-flag.pr-Low { color: var(--pr-low); }

  /* ---------- Gantt ---------- */
  .gantt-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .zoom-toggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .zoom-toggle button {
    border: none; background: none; padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-secondary); cursor: pointer;
  }
  .zoom-toggle button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .gantt-legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .gantt-legend .item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-secondary); font-weight: 600; }
  .gantt-legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .gantt-scroll { overflow: auto; position: relative; }
  .gantt-inner { position: relative; }
  .gantt-header-row { display: flex; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--border); }
  .gantt-header-spacer { position: sticky; left: 0; z-index: 4; background: var(--surface); flex: none; width: 268px; border-right: 1px solid var(--border); }
  .gantt-tick { flex: none; position: relative; padding: 8px 0 8px 8px; font-size: 11px; font-weight: 700; color: var(--ink-muted); border-right: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.3px; }
  .gantt-body { display: flex; position: relative; }
  .gantt-rowlabels { flex: none; width: 268px; position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--border); }
  .gantt-timeline { position: relative; flex: none; }

  .g-row { display: flex; align-items: center; height: 44px; border-bottom: 1px solid var(--border); }
  .g-row.group-venue { background: var(--felt); color: var(--felt-ink); }
  .g-row.group-venue .g-count { color: var(--felt-ink-muted); }
  .g-row.group-project { background: var(--surface-2); }
  .g-rowlabel { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px 0 8px; border-bottom: 1px solid var(--border); overflow: hidden; }
  .g-rowlabel.group-venue { background: var(--felt); color: var(--felt-ink); }
  .g-rowlabel.group-project { background: var(--surface-2); }
  .g-collapse { flex: none; background: none; border: none; cursor: pointer; color: inherit; opacity: 0.75; padding: 4px; display: flex; }
  .g-collapse:hover { opacity: 1; }
  .g-collapse svg { transition: transform 0.15s ease; }
  .g-collapse.collapsed svg { transform: rotate(-90deg); }
  .g-label-name { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .g-label-name.task-label { font-weight: 600; font-size: 12.5px; padding-left: 20px; }
  .g-count { font-size: 11px; color: var(--ink-muted); font-weight: 600; flex: none; }
  .g-icon-flag { flex: none; display: inline-flex; opacity: 0.9; }

  .gantt-gridline { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--border); }
  .gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
  .gantt-today .flag {
    position: sticky; top: 34px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; display: inline-block; margin-top: 2px;
  }

  .g-bar-track { position: absolute; }
  .g-bar {
    position: absolute; top: 0; bottom: 0; border-radius: 7px; cursor: grab; overflow: hidden;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.08);
  }
  .g-bar:active { cursor: grabbing; }
  .g-bar.st-notstarted { background: var(--st-notstarted-soft); border-color: var(--st-notstarted); }
  .g-bar.st-inprogress { background: var(--st-inprogress-soft); border-color: var(--st-inprogress); }
  .g-bar.st-blocked { background: var(--st-blocked-soft); border-color: var(--st-blocked); }
  .g-bar.st-done { background: var(--st-done-soft); border-color: var(--st-done); }
  .g-bar-fill { position: absolute; inset: 0; width: 0%; border-radius: 6px 0 0 6px; opacity: 0.55; }
  .g-bar.st-notstarted .g-bar-fill { background: var(--st-notstarted); }
  .g-bar.st-inprogress .g-bar-fill { background: var(--st-inprogress); }
  .g-bar.st-blocked .g-bar-fill { background: var(--st-blocked); }
  .g-bar.st-done .g-bar-fill { background: var(--st-done); }
  .g-bar-label {
    position: relative; z-index: 1; font-size: 11.5px; font-weight: 700; padding: 0 8px; line-height: 24px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); display: block;
  }
  .g-bar-handle { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 2; }
  .g-bar-handle.left { left: 0; } .g-bar-handle.right { right: 0; }
  .g-milestone { position: absolute; top: 4px; width: 16px; height: 16px; transform: translateX(-8px) rotate(45deg); cursor: grab; }
  .g-milestone.st-notstarted { background: var(--st-notstarted); }
  .g-milestone.st-inprogress { background: var(--st-inprogress); }
  .g-milestone.st-blocked { background: var(--st-blocked); }
  .g-milestone.st-done { background: var(--st-done); }

  .g-bar.just-completed { animation: bar-pop 0.5s ease; }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes bar-pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); box-shadow: 0 0 0 6px var(--st-done-soft); }
      100% { transform: scale(1); box-shadow: none; }
    }
  }
  @media (prefers-reduced-motion: reduce) { .g-bar.just-completed { animation: none; } }

  .g-dep-line { stroke: var(--ink-muted); stroke-width: 1.5; fill: none; opacity: 0.55; }
  .g-dep-arrow { fill: var(--ink-muted); opacity: 0.55; }

  /* ---------- Budget ---------- */
  .budget-card { padding: 14px 16px; }
  .budget-project-row { padding: 14px 4px; border-bottom: 1px solid var(--border); }
  .budget-project-row:last-child { border-bottom: none; }
  .bp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .bp-name { font-size: 14px; font-weight: 700; }
  .bp-venue { font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
  .bp-figures { font-size: 12.5px; color: var(--ink-secondary); font-weight: 600; text-align: right; }
  .bp-bar-track { height: 12px; border-radius: 6px; background: var(--surface-2); position: relative; overflow: hidden; border: 1px solid var(--border); }
  .bp-bar-fill { position: absolute; inset: 0; width: 0%; border-radius: 6px; background: var(--st-inprogress); }
  .bp-bar-fill.over { background: var(--st-blocked); }
  .bp-bar-fill.warn { background: var(--pr-high); }
  .bp-marker { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.5; }
  .bp-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; }
  .burn-chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .burn-ontrack { background: var(--st-done-soft); color: var(--st-done); }
  .burn-watch { background: rgba(201,132,11,0.14); color: var(--pr-high); }
  .burn-over { background: var(--st-blocked-soft); color: var(--st-blocked); }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ink-muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  table.data-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
  table.data-table tbody tr:hover { background: var(--surface-2); }
  table.data-table tbody tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Calendar ---------- */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .cal-dow { background: var(--surface-2); padding: 7px 8px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); letter-spacing: 0.4px; }
  .cal-cell { background: var(--surface); min-height: 92px; padding: 6px 6px; display: flex; flex-direction: column; gap: 3px; }
  .cal-cell.out { background: var(--surface-2); opacity: 0.5; }
  .cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-daynum { font-size: 12px; font-weight: 700; color: var(--ink-secondary); }
  .cal-chip { font-size: 10.5px; font-weight: 700; padding: 2px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

  /* ---------- Modal (dialog) ---------- */
  dialog.modal { border: none; border-radius: 14px; padding: 0; width: min(560px, 92vw); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  dialog.modal::backdrop { background: rgba(10, 14, 12, 0.45); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; font-size: 15.5px; }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; max-height: 66vh; overflow-y: auto; }
  .modal-foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-top: 1px solid var(--border); }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; color: var(--ink-muted); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); border-radius: var(--radius-sm);
    padding: 8px 10px; font-size: 13.5px; font-family: inherit; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checklist-item { display: flex; align-items: center; gap: 8px; }
  .checklist-item input[type="checkbox"] { flex: none; width: auto; }
  .checklist-item input[type="text"] { flex: 1; width: auto; }
  .checklist-add { display: flex; gap: 8px; }
  .icon-x { flex: none; background: none; border: none; cursor: pointer; color: var(--ink-muted); padding: 4px; display: flex; }
  .icon-x:hover { color: var(--st-blocked); }
  .status-pick, .priority-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-pick button, .priority-pick button {
    border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 6px 11px;
    font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink-secondary);
  }
  .status-pick button.active, .priority-pick button.active { border-color: currentColor; }
  .status-pick button[data-v="Not Started"].active { color: var(--st-notstarted); background: var(--st-notstarted-soft); }
  .status-pick button[data-v="In Progress"].active { color: var(--st-inprogress); background: var(--st-inprogress-soft); }
  .status-pick button[data-v="Blocked"].active { color: var(--st-blocked); background: var(--st-blocked-soft); }
  .status-pick button[data-v="Done"].active { color: var(--st-done); background: var(--st-done-soft); }
  .priority-pick button[data-v="Low"].active { color: var(--pr-low); }
  .priority-pick button[data-v="Medium"].active { color: var(--pr-medium); }
  .priority-pick button[data-v="High"].active { color: var(--pr-high); }
  .priority-pick button[data-v="Critical"].active { color: var(--pr-critical); }
  .modal-danger { color: var(--st-blocked); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .toggle-row .hint { font-size: 11.5px; color: var(--ink-muted); }
  .switch { position: relative; width: 36px; height: 21px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--border-strong); border-radius: 999px; cursor: pointer; transition: background 0.15s; }
  .switch .track::before { content: ""; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px; background: var(--surface); border-radius: 50%; transition: transform 0.15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(15px); }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--felt); color: var(--felt-ink); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; }
  .banner-info { background: var(--accent-soft); color: var(--accent-soft-ink); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
